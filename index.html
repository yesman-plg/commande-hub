<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0..1,0&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f7;
    --bg-elevated: #ffffff;
    --border: #e2e2e6;
    --text: #1c1c1f;
    --text-dim: #6b6b74;
    --accent: #6d5efc;
    --accent-text: #ffffff;
    --code-bg: #f0eefe;
    --code-text: #4a3fc9;
    --chip-bg: #ececf1;
    --chip-active-bg: #6d5efc;
    --chip-active-text: #ffffff;
    --danger: #d64545;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 10px rgba(0,0,0,.03);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171b;
      --bg-elevated: #201f26;
      --border: #302f38;
      --text: #eceaf5;
      --text-dim: #94919f;
      --accent: #8f7dff;
      --accent-text: #17171b;
      --code-bg: #262233;
      --code-text: #b9adff;
      --chip-bg: #2a2932;
      --chip-active-bg: #8f7dff;
      --chip-active-text: #17171b;
      --danger: #ff8080;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    }
  }
  /* Bascule manuelle : force le thème quel que soit le système */
  :root[data-theme="dark"] {
    --bg: #17171b;
    --bg-elevated: #201f26;
    --border: #302f38;
    --text: #eceaf5;
    --text-dim: #94919f;
    --accent: #8f7dff;
    --accent-text: #17171b;
    --code-bg: #262233;
    --code-text: #b9adff;
    --chip-bg: #2a2932;
    --chip-active-bg: #8f7dff;
    --chip-active-text: #17171b;
    --danger: #ff8080;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .material-symbols-outlined {
    display: inline-block;
    font-family: "Material Symbols Outlined";
    font-weight: normal;
    font-style: normal;
    font-size: 20px;
    line-height: 1;
    letter-spacing: normal;
    text-transform: none;
    white-space: nowrap;
    word-wrap: normal;
    direction: ltr;
    -webkit-font-feature-settings: "liga";
    font-feature-settings: "liga";
    font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24;
  }
  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  header h1 {
    font-size: 22px;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header p {
    color: var(--text-dim);
    margin: 0 0 4px;
    font-size: 14px;
  }
  .stats-line {
    color: var(--text-dim);
    font-size: 12.5px;
    margin: 0 0 22px;
  }
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 18px;
  }
  .theme-toggle {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: var(--shadow);
    white-space: nowrap;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .top-row-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .lang-toggle {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: var(--shadow);
    white-space: nowrap;
  }
  .lang-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .lang-gate {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    padding: 20px;
  }
  .lang-gate-card {
    max-width: 360px;
    width: 100%;
    text-align: center;
  }
  .lang-gate-logo { font-size: 40px; margin-bottom: 10px; }
  .lang-gate-card h1 {
    font-size: 22px;
    margin: 0 0 8px;
  }
  .lang-gate-card p {
    color: var(--text-dim);
    font-size: 14px;
    margin: 0 0 24px;
  }
  .lang-gate-buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .lang-choice {
    padding: 14px 18px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .lang-choice:hover { border-color: var(--accent); color: var(--accent); }
  .translation-notice {
    background: var(--code-bg);
    color: var(--code-text);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 18px;
    line-height: 1.4;
  }
  .search-bar {
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: 8px 0 14px;
    z-index: 10;
  }
  #search {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text);
    outline: none;
    box-shadow: var(--shadow);
  }
  #search:focus { border-color: var(--accent); }
  .search-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }
  .search-row #search { flex: 1; }
  .fav-toggle {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow);
    white-space: nowrap;
  }
  .fav-toggle.active {
    border-color: #d6a326;
    color: #d6a326;
    background: color-mix(in srgb, #d6a326 12%, var(--bg-elevated));
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .groupchips {
    margin-top: 12px;
    margin-bottom: -2px;
  }
  .group-chip {
    font-weight: 600;
    padding: 7px 15px;
  }
  .subchips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
  }
  .chip {
    display: inline-flex;
    align-items: center;
    padding: 6px 13px;
    border-radius: 999px;
    background: var(--chip-bg);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .subchips .chip {
    padding: 4px 11px;
    font-size: 12px;
    background: transparent;
    border: 1px solid var(--border);
  }
  .chip.active {
    background: var(--chip-active-bg);
    color: var(--chip-active-text);
    font-weight: 600;
  }
  .group-chip-chevron {
    width: 6px;
    height: 6px;
    margin-left: 7px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: rotate(45deg) translateY(-2px);
    transition: transform .15s ease;
  }
  .group-chip.expanded .group-chip-chevron { transform: rotate(225deg) translateY(-2px); }
  .subchips .chip.active {
    border-color: var(--accent);
  }
  .search-hint {
    margin-top: 12px;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .related-line {
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .related-line .guide-link { font-size: inherit; }
  .count-badge {
    opacity: .65;
    font-weight: 400;
    margin-left: 3px;
  }
  .group-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--text-dim);
    margin: 28px 0 10px;
    font-weight: 600;
  }
  .group-title:first-of-type { margin-top: 18px; }
  .subgroup-title {
    font-size: 12px;
    color: var(--accent);
    margin: 18px 0 8px 2px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .subgroup-title::before {
    content: "";
    width: 10px;
    height: 1px;
    background: var(--accent);
    opacity: .5;
  }
  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .card-title-row {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .card-title {
    font-weight: 600;
    font-size: 14.5px;
  }
  .card-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .fav-btn {
    flex-shrink: 0;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 16px;
    line-height: 1;
    padding: 4px;
    cursor: pointer;
    border-radius: 6px;
  }
  .fav-btn:hover { color: #d6a326; }
  .fav-btn.active { color: #d6a326; font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 24; }
  .copy-btn {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text-dim);
    font-size: 12.5px;
    padding: 5px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy-btn.copied {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }
  pre.cmd {
    margin: 8px 0;
    padding: 10px 12px;
    background: var(--code-bg);
    color: var(--code-text);
    border-radius: 9px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 13px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .desc {
    font-size: 13px;
    color: var(--text-dim);
    margin: 6px 0 0;
    line-height: 1.4;
  }
  .tags {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .tag {
    font-size: 11px;
    color: var(--text-dim);
    background: var(--chip-bg);
    padding: 2px 8px;
    border-radius: 999px;
  }
  .empty {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 0;
    font-size: 14px;
  }
  kbd {
    background: var(--chip-bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 6px;
    font-size: 11.5px;
    font-family: inherit;
  }
  .mode-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    background: var(--chip-bg);
    padding: 4px;
    border-radius: 12px;
    width: fit-content;
  }
  .mode-tab {
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 13.5px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 9px;
    cursor: pointer;
    font-family: inherit;
  }
  .mode-tab.active {
    background: var(--bg-elevated);
    color: var(--text);
    box-shadow: var(--shadow);
  }
  /* --- Liste des fiches Formation (lignes cliquables) --- */
  .guide-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
  }
  .guide-card-row {
    cursor: pointer;
    transition: border-color .15s;
  }
  .guide-card-row:hover { border-color: var(--accent); }
  .guide-row-top {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .guide-row-top::after {
    content: "›";
    color: var(--text-dim);
    font-size: 18px;
    line-height: 1;
    flex-shrink: 0;
  }
  .guide-row-top .guide-title { margin-right: auto; }
  .exercise-flag { font-size: 12px; flex-shrink: 0; }
  .guide-row-summary {
    font-size: 13px;
    color: var(--text-dim);
    margin: 6px 0 0 14px;
    line-height: 1.4;
  }
  .guide-dot {
    width: 8px;
    height: 8px;
    min-width: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--border);
  }
  .guide-dot.lvl-green { background: #3aa76d; }
  .guide-dot.lvl-yellow { background: #d6a326; }
  .guide-dot.lvl-red { background: var(--danger); }
  /* Même échelle d'espacement (6px) que .subgroup-title, .card-title-row,
     .fav-toggle, .mode-tabs — la pastille suit la même règle "icône + texte"
     que partout ailleurs dans le site. */
  .chip .guide-dot { margin-right: 6px; }
  .guide-title {
    font-weight: 600;
    font-size: 14.5px;
  }

  /* --- Page dédiée d'une fiche (théorie → exercices) --- */
  .guide-detail {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 24px 26px;
    box-shadow: var(--shadow);
  }
  .back-btn {
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    padding: 0;
    margin-bottom: 18px;
  }
  .back-btn:hover { color: var(--accent); }
  .detail-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .detail-title {
    font-size: 19px;
    margin: 0;
    margin-right: auto;
    letter-spacing: -.01em;
  }
  .detail-summary {
    font-size: 13.5px;
    color: var(--text-dim);
    line-height: 1.5;
    margin: 0 0 20px;
  }
  .detail-steps {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
  }
  .detail-step {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .05em;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--chip-bg);
    color: var(--text-dim);
  }
  .detail-step.active {
    background: var(--chip-active-bg);
    color: var(--chip-active-text);
  }
  .guide-section {
    margin-top: 14px;
  }
  .guide-section:first-of-type { margin-top: 0; }
  .guide-section h4 {
    font-size: 13px;
    margin: 0 0 6px;
    color: var(--accent);
  }
  .guide-section p {
    font-size: 13.5px;
    line-height: 1.55;
    margin: 0 0 8px;
    white-space: pre-line;
  }
  .guide-section p:last-child { margin-bottom: 0; }
  .next-step-btn {
    display: block;
    margin: 24px 0 0;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-text);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .next-step-btn.secondary {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .next-step-btn:hover { opacity: .9; }
  .exercises-block {
    margin-top: 0;
  }
  .exercise {
    margin-bottom: 18px;
  }
  .exercise:last-child { margin-bottom: 0; }
  .exercise-instruction {
    font-size: 13.5px;
    line-height: 1.55;
    margin: 0 0 10px;
  }
  .fterm {
    background: #17171b;
    border-radius: 10px;
    padding: 10px 12px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 12.5px;
    margin-bottom: 8px;
  }
  .fterm-output {
    max-height: 220px;
    overflow-y: auto;
    color: #d7d7dc;
  }
  .fterm-line {
    padding: 1px 0;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .fterm-line.fterm-cmd { color: #a99bff; }
  .fterm-line.fterm-error { color: #ff8f8f; }
  .fterm-line.fterm-success { color: #6fd39a; font-weight: 600; }
  .fterm-inputline {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
  }
  .fterm-prompt { color: #6fd39a; flex-shrink: 0; }
  .fterm-input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: #eceaf5;
    font-family: inherit;
    font-size: inherit;
  }
  .fterm.fterm-done { box-shadow: inset 0 0 0 1px #3aa76d; }
  .exercise-reveal summary {
    cursor: pointer;
    font-size: 12.5px;
    color: var(--accent);
    font-weight: 600;
    list-style: none;
  }
  .exercise-reveal summary::-webkit-details-marker { display: none; }
  .exercise-reveal summary::before { content: "💡 "; }
  .exercise-reveal[open] summary::before { content: "✅ "; }
  .exercise-correction-body {
    margin-top: 8px;
    padding: 10px 12px;
    background: var(--code-bg);
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text);
    white-space: pre-line;
  }
  /* --- QCM --- */
  .quiz-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .quiz-option {
    text-align: left;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    cursor: pointer;
  }
  .quiz-option:hover:not(:disabled) { border-color: var(--accent); }
  .quiz-option:disabled { cursor: default; }
  .quiz-option.correct {
    border-color: #3aa76d;
    background: color-mix(in srgb, #3aa76d 14%, var(--bg-elevated));
    font-weight: 600;
  }
  .quiz-option.incorrect {
    border-color: var(--danger);
    background: color-mix(in srgb, var(--danger) 14%, var(--bg-elevated));
  }
  /* --- Réponse à saisir --- */
  .fillin-row {
    display: flex;
    gap: 8px;
  }
  .fillin-input {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text);
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 13px;
    outline: none;
  }
  .fillin-input:focus { border-color: var(--accent); }
  .fillin-input:disabled { opacity: .75; }
  .fillin-check {
    flex-shrink: 0;
    padding: 0 16px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .fillin-check:disabled { opacity: .6; cursor: default; }
  .fillin.fillin-correct .fillin-input { border-color: #3aa76d; }
  .fillin.fillin-incorrect .fillin-input { border-color: var(--danger); }
  /* --- Commun QCM / réponse à saisir --- */
  .quiz-feedback, .fillin-feedback {
    margin-top: 10px;
    font-size: 13px;
    line-height: 1.5;
    display: none;
  }
  .quiz-feedback.visible, .fillin-feedback.visible { display: block; }
  .feedback-ok { color: #3aa76d; font-weight: 600; }
  .feedback-ko { color: var(--danger); font-weight: 600; }
  .guide-link {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent);
    cursor: pointer;
  }
  .guide-link:hover { text-decoration-color: var(--accent); }
  /* Vrai lien externe (dépôt GitHub, etc.) cité dans le texte d'une fiche —
     visuellement distinct d'un lien interne (icône de sortie). */
  .external-link {
    color: var(--accent);
    text-decoration: underline;

<script>
  const searchInput = document.getElementById("search");
  const groupChipsEl = document.getElementById("groupChips");
  const chipsEl = document.getElementById("chips");
  const subchipsEl = document.getElementById("subchips");
  const chipsWrapEl = document.getElementById("chipsWrap");
  const searchHintEl = document.getElementById("searchHint");
  const topRowEl = document.getElementById("topRow");
  const searchBarEl = document.getElementById("searchBar");
  const resultsEl = document.getElementById("results");
  const modeTabsEl = document.getElementById("modeTabs");
  const favToggleEl = document.getElementById("favToggle");
  const favToggleLabelEl = document.getElementById("favToggleLabel");
  const statsLineEl = document.getElementById("statsLine");
  const themeToggleEl = document.getElementById("themeToggle");
  const langGateEl = document.getElementById("langGate");
  const langToggleEl = document.getElementById("langToggle");
  const headerTaglineEl = document.getElementById("headerTagline");
  const appShellEl = document.querySelector(".app-shell");
  const sidebarCloseBtn = document.getElementById("sidebarCloseBtn");
  const sidebarOpenBtn = document.getElementById("sidebarOpenBtn");
  const pageHeaderEl = document.getElementById("pageHeader");
  const breadcrumbEl = document.getElementById("breadcrumb");
  const pageTitleEl = document.getElementById("pageTitle");
  const pageDescriptionEl = document.getElementById("pageDescription");
  const modeTabCommandsLabelEl = document.getElementById("modeTabCommandsLabel");
  const modeTabFormationLabelEl = document.getElementById("modeTabFormationLabel");

  const LEVEL_ORDER = ["🟢 Débutant", "🟡 Intermédiaire", "🔴 Avancé"];

  // --- Lien direct commande citée dans une fiche Formation -> carte Commandes ---
  // Clé = texte exact du champ cmd (identique FR/EN, jamais traduit) -> commande.
  // Alimente le rendu des `commandes citées` en texte de fiche (voir
  // renderGuideParagraph) : stylées comme dans Commandes, et cliquables
  // uniquement quand la commande existe réellement comme carte.
  const COMMAND_BY_CMD = new Map();
  COMMANDS.forEach(c => { if (!COMMAND_BY_CMD.has(c.cmd)) COMMAND_BY_CMD.set(c.cmd, c); });
  // Du plus long au plus court, pour faire correspondre en priorité la
  // commande la plus spécifique (évite qu'une sous-chaîne courte "gagne"
  // avant la commande complète qui la contient).
  const COMMAND_CMD_LIST = Array.from(COMMAND_BY_CMD.keys()).sort((a, b) => b.length - a.length);

  function navigateToCommand(category, title) {
    const target = COMMANDS.find(c => c.category === category && c.title === title);
    if (!target) return;
    mode = "commands";
    openGuide = null;
    query = "";
    searchInput.value = "";
    activeGroup = groupOf(category);
    expandedGroup = activeGroup;
    activeCategory = category;
    activeSubcategory = "Toutes";
    saveState();
    renderModeTabs();
    renderGroupChips();
    renderChips();
    renderSubchips();
    renderResults();
    requestAnimationFrame(() => {
      const el = resultsEl.querySelector(`.card[data-command-category="${cssEscape(category)}"][data-command-title="${cssEscape(title)}"]`);
      if (!el) return;
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      el.classList.remove("landed");
      void el.offsetWidth; // force le redémarrage de l'animation si déjà jouée
      el.classList.add("landed");
    });
  }

  function cssEscape(s) {
    return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\\]]/g, "\\$&");
  }
  const STATE_KEY = "cmdhub_state_v1";
  const FAV_KEY = "cmdhub_favorites_v1";
  const THEME_KEY = "cmdhub_theme_v1";
  const LANG_KEY = "cmdhub_lang_v1";
  const SIDEBAR_KEY = "cmdhub_sidebar_collapsed_v1";

  // --- Langue (FR / EN) ---------------------------------------------------
  const UI_STRINGS = {
    fr: {
      tagline: "Toutes tes commandes et fiches de formation — Claude Code, Codex, Linux, Windows, Git, Kotlin/Android, Expo/React Native — au même endroit. Tape pour chercher, clique pour copier.",
      statsLine: (n, m) => `${n} commandes · ${m} fiches de formation`,
      modeCommands: "Commandes",
      modeFormation: "Formation",
      searchPlaceholderCommands: "Rechercher une commande, un tag, une description… (touche /)",
      searchPlaceholderFormation: "Rechercher une notion, un thème… (touche /)",
      favLabel: (n) => `Favoris (${n})`,
      favToggleTitle: "N'afficher que mes favoris",
      themeToggleTitle: "Changer le thème",
      langToggleLabel: "🌐 EN",
      searchHint: "🔍 Recherche simultanée dans Commandes et Formation — les filtres reprennent une fois la recherche effacée",
      emptyCommands: "Aucune commande ne correspond 🤷",
      emptyCommandsFav: "Aucun favori ici — clique sur l’étoile à côté d'une commande pour l'ajouter ⭐",
      emptyFormation: "Aucune fiche ne correspond 🤷",
      emptyFormationFav: "Aucun favori ici — clique sur l’étoile à côté d'une fiche pour l'ajouter ⭐",

  sidebarCloseBtn.addEventListener("click", () => setSidebarCollapsed(true));

  // --- Applique la langue courante à tout le texte statique de l'interface ---
  function applyLang() {

  function setLang(newLang) {

    applyLang();

  let favorites = loadFavorites();

  function loadFavorites() {
    try {
      const raw = JSON.parse(localStorage.getItem(FAV_KEY));
      return {
        commands: Array.isArray(raw && raw.commands) ? raw.commands : [],
        formation: Array.isArray(raw && raw.formation) ? raw.formation : []
      };
    } catch (e) {
      return { commands: [], formation: [] };
    }
  }

  function saveFavorites() {
    try { localStorage.setItem(FAV_KEY, JSON.stringify(favorites)); } catch (e) {}

    return type === "formation"
      ? `${item.category}|${item.title}`
      : `${item.category}|${item.subcategory || ""}|${item.title}`;

  function isFavoriteFor(type, item) {
    return favorites[type].includes(favKeyFor(type, item));

  function toggleFavoriteFor(type, key) {

    if (i === -1) list.push(key); else list.splice(i, 1);

  }

      }));
    } catch (e) {}
  }

  function restoreState() {
    let saved;
    try { saved = JSON.parse(localStorage.getItem(STATE_KEY)); } catch (e) { saved = null; }
    if (!saved) return;

    if (saved.mode === "commands" || saved.mode === "formation") mode = saved.mode;

    const groups = groupsFor(dataset());
    if (typeof saved.activeGroup === "string" && groups.includes(saved.activeGroup)) {
      activeGroup = saved.activeGroup;
    }

    const cats = categoriesFor(dataset());
    if (typeof saved.activeCategory === "string" && cats.includes(saved.activeCategory)) {
      activeCategory = saved.activeCategory;
    }
    if (typeof saved.activeSubcategory === "string") {
      const subs = ["Toutes", ...subcategoriesFor(activeCategory)];
      if (subs.includes(saved.activeSubcategory)) activeSubcategory = saved.activeSubcategory;
    }
    if (typeof saved.activeLevel === "string") {
      activeLevel = saved.activeLevel; // validé implicitement par le filtre (aucun résultat sinon, sans casser l'UI)

    if (typeof saved.query === "string") query = saved.query;

  function levelClass(level) {
    if (!level) return "";
    if (level.includes("🟢")) return "lvl-green";

  // qui ne correspond jamais exactement à nos couleurs personnalisées.
  function levelText(level) {
    return (level || "").replace(/^\S+\s*/, "");
  }

  function renderChips() {

  function renderSubchips() {
    if (mode === "formation") {
      // Une catégorie de fiches peut être classée par sous-catégorie plutôt
      // que par niveau (ex : Skills & Agents → Skills / Agents) — dans ce
      // cas, les chips de sous-catégorie remplacent les chips de niveau.
      const guideSubs = subcategoriesFor(activeCategory);
      if (guideSubs.length >= 2) {
        renderGuideSubchips(guideSubs);
      } else {
        renderLevelChips();

      return;

    const subs = subcategoriesFor(activeCategory);
    if (subs.length < 2) {

      subchipsEl.innerHTML = "";

    subchipsEl.style.display = "flex";
    subchipsEl.innerHTML = subs.map(sub => {

      (activeCategory === "Toutes" || g.category === activeCategory)
    );
    const present = LEVEL_ORDER.filter(lvl => relevant.some(g => g.level === lvl));
    if (present.length < 2) {
      subchipsEl.style.display = "none";
      subchipsEl.innerHTML = "";
      return;
    }
    subchipsEl.style.display = "flex";
    subchipsEl.innerHTML = present.map(lvl => {
      const n = relevant.filter(g => g.level === lvl).length;
      const active = lvl === activeLevel ? "active" : "";
      return `<span class="chip ${active}" data-level="${escapeAttr(lvl)}"><span class="guide-dot ${levelClass(lvl)}"></span>${escapeHtml(translateLevelText(levelText(lvl)))}<span class="count-badge">${n}</span></span>`;
    }).join("");
    subchipsEl.querySelectorAll(".chip").forEach(el => {
      el.addEventListener("click", () => {
        // re-cliquer sur le niveau déjà actif désélectionne (retour à "tous")
        activeLevel = (el.dataset.level === activeLevel) ? "Toutes" : el.dataset.level;
        saveState();
        renderLevelChips();
        renderResults();
      });
    });
  }

  // Chips de sous-catégorie pour une catégorie de fiches Formation qui n'est
  // pas classée par niveau (ex : Skills & Agents) — même interaction que
  // renderLevelChips, mais sur item.subcategory plutôt que item.level.
  function renderGuideSubchips(subs) {
    const relevant = GUIDES.filter(g =>
      (activeGroup === "Toutes" || groupOf(g.category) === activeGroup) &&
      (activeCategory === "Toutes" || g.category === activeCategory)
    );
    subchipsEl.style.display = "flex";
    subchipsEl.innerHTML = subs.map(sub => {
      const n = relevant.filter(g => g.subcategory === sub).length;
      const active = sub === activeSubcategory ? "active" : "";
      return `<span class="chip ${active}" data-sub="${escapeAttr(sub)}">${escapeHtml(subcatLabel(sub))}<span class="count-badge">${n}</span></span>`;
    }).join("");
    subchipsEl.querySelectorAll(".chip").forEach(el => {
      el.addEventListener("click", () => {
        activeSubcategory = (el.dataset.sub === activeSubcategory) ? "Toutes" : el.dataset.sub;
        saveState();
        renderSubchips();
        renderResults();
      });
    });
  }

  function matchesCommand(item, q) {
    if (!q) return true;
    const loc = localizedCommand(item);
    const haystack = [item.title, loc.title, item.cmd, item.desc, loc.desc, item.category, item.subcategory, ...(item.tags || []), ...(loc.tags || [])]
      .join(" ")
      .toLowerCase();
    return q.toLowerCase().split(/\s+/).every(part => haystack.includes(part));
  }

  function matchesGuide(item, q) {
    if (!q) return true;
    const loc = localizedGuide(item);
    const contentText = (item.content || []).map(s => `${s.heading} ${s.text}`).join(" ");
    const locContentText = (loc.content || []).map(s => `${s.heading} ${s.text}`).join(" ");
    const haystack = [item.title, loc.title, item.summary, loc.summary, item.category, item.level, contentText, locContentText]
      .join(" ")
      .toLowerCase();
    return q.toLowerCase().split(/\s+/).every(part => haystack.includes(part));
  }

  function renderResults() {
    updateContextHeader();
    renderFavToggle();
    if (openGuide) {
      topRowEl.style.display = "none";
      subchipsEl.style.display = "none";
      renderGuideDetail();
      return;
    }
    topRowEl.style.display = "";

    const searching = query.trim() !== "";
    chipsWrapEl.style.display = "";
    searchHintEl.style.display = searching ? "block" : "none";

    if (searching) {
      renderTransversalResults();
    } else if (mode === "formation") {
      renderGuideResults();
    } else {
      renderCommandResults();
    }
  }

  function openGuideDetail(item) {
    openGuide = item;
    guideStep = "theory";
    renderModeTabs();
    renderResults();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function closeGuideDetail() {
    openGuide = null;
    renderSubchips();
    renderResults();
  }

  function renderGuideDetail() {
    const item = openGuide;
    const loc = localizedGuide(item);
    const fav = isFavoriteFor("formation", item);
    const hasExercises = loc.exercises && loc.exercises.length > 0;
    const onTheory = guideStep === "theory" || !hasExercises;

    let html = `<div class="guide-detail">`;
    html += `<button class="back-btn" data-action="back-to-list">${t("backToList")}</button>`;
    if (lang === "en" && !loc.translated) html += `<div class="translation-notice">${t("formationNotice")}</div>`;
    html += `
      <div class="detail-head">
        ${item.level ? `<span class="guide-dot ${levelClass(item.level)}" title="${escapeAttr(item.level)}"></span>` : ""}
        <h2 class="detail-title">${escapeHtml(loc.title)}</h2>
        <button class="fav-btn material-symbols-outlined ${fav ? "active" : ""}" data-favtype="formation" data-favkey="${escapeAttr(favKeyFor("formation", item))}" title="${fav ? t("removeFav") : t("addFav")}">star</button>
      </div>
      <p class="detail-summary">${escapeHtml(loc.summary)}</p>`;

    if (hasExercises) {
      html += `
        <div class="detail-steps">
          <span class="detail-step ${onTheory ? "active" : ""}">${t("stepTheory")}</span>
          <span class="detail-step ${!onTheory ? "active" : ""}">${t("stepExercises")}</span>
        </div>`;
    }

    if (onTheory) {
      html += (loc.content || []).map(s => `
        <div class="guide-section">
          <h4>${escapeHtml(s.heading)}</h4>
          <p>${renderGuideParagraph(s.text)}</p>
        </div>`).join("");
      if (hasExercises) {
        html += `<button class="next-step-btn" data-action="go-exercises">${t("goExercises")}</button>`;
      }
    } else {
      TERMINAL_REGISTRY = {};
      QUIZ_REGISTRY = {};
      FILLIN_REGISTRY = {};
      html += exercisesHtml(loc.exercises, guideDomId(item));
      html += `<button class="next-step-btn secondary" data-action="back-to-theory">${t("backToTheory")}</button>`;
    }

    html += `</div>`;
    resultsEl.innerHTML = html;
    if (!onTheory) initExercises();
  }

  // --- Gabarits de carte réutilisés par le parcours par onglet ET la recherche transversale ---
  function renderRelatedLinks(item) {
    if (!item.related) return "";
    const list = Array.isArray(item.related) ? item.related : [item.related];
    const links = list.map(r => {
      const sep = r.indexOf("::");
      if (sep === -1) return "";
      const cat = r.slice(0, sep), title = r.slice(sep + 2);
      return `<a href="#" class="guide-link" data-cat="${escapeAttr(cat)}" data-title="${escapeAttr(title)}">${escapeHtml(title)}</a>`;
    }).filter(Boolean).join(", ");
    return links ? `<div class="related-line">${t("forUnderstanding")} ${links}</div>` : "";
  }

  function commandCardHtml(item, id) {
    const fav = isFavoriteFor("commands", item);
    const loc = localizedCommand(item);
    return `
      <div class="card" data-command-category="${escapeAttr(item.category)}" data-command-title="${escapeAttr(item.title)}">
        <div class="card-top">
          <div class="card-title-row">
            <button class="fav-btn material-symbols-outlined ${fav ? "active" : ""}" data-favtype="commands" data-favkey="${escapeAttr(favKeyFor("commands", item))}" title="${fav ? t("removeFav") : t("addFav")}">star</button>
            <div class="card-title">${escapeHtml(loc.title)}</div>
          </div>
          <button class="copy-btn" data-id="${escapeAttr(id)}">${t("copy")}</button>
        </div>
        <pre class="cmd" id="cmd-${escapeAttr(id)}">${escapeHtml(item.cmd)}</pre>
        ${loc.desc ? `<div class="desc">${escapeHtml(loc.desc)}</div>` : ""}
        ${loc.tags && loc.tags.length ? `<div class="tags">${loc.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>` : ""}
        ${renderRelatedLinks(item)}
      </div>`;
  }

  // --- Exercices pratiques : terminal simulé, QCM, réponse à saisir --------
  // Registres reconstruits à chaque rendu : id de l'encadré → état.
  let TERMINAL_REGISTRY = {};
  let QUIZ_REGISTRY = {};
  let FILLIN_REGISTRY = {};

  function terminalHtml(ex, termId) {
    if (ex.type !== "terminal" || !ex.terminal) return "";
    TERMINAL_REGISTRY[termId] = { steps: ex.terminal.steps || [], stepIndex: 0, hint: ex.hint || "" };
    return `
      <div class="fterm" id="${escapeAttr(termId)}">
        <div class="fterm-output"></div>
        <div class="fterm-inputline">
          <span class="fterm-prompt">${escapeHtml(ex.terminal.prompt || "user@mint:~$")}</span>
          <input type="text" class="fterm-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${escapeAttr(t("terminalPlaceholder"))}">
        </div>
      </div>`;
  }

  function quizHtml(ex, quizId) {
    if (ex.type !== "quiz" || !ex.options) return "";
    QUIZ_REGISTRY[quizId] = { correctIndex: ex.correctIndex, correction: ex.correction, answered: false };
    const opts = ex.options.map((opt, idx) =>
      `<button class="quiz-option" data-idx="${idx}">${escapeHtml(opt)}</button>`
    ).join("");
    return `
      <div class="quiz" id="${escapeAttr(quizId)}">
        <div class="quiz-options">${opts}</div>
        <div class="quiz-feedback"></div>
      </div>`;
  }

  function fillinHtml(ex, fillId) {
    if (ex.type !== "fillin") return "";
    FILLIN_REGISTRY[fillId] = {
      accept: Array.isArray(ex.accept) ? ex.accept : [ex.accept],
      correction: ex.correction,
      answered: false
    };
    return `
      <div class="fillin" id="${escapeAttr(fillId)}">
        <div class="fillin-row">
          <input type="text" class="fillin-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${escapeAttr(t("fillinPlaceholder"))}">
          <button class="fillin-check">${t("fillinCheck")}</button>
        </div>
        <div class="fillin-feedback"></div>
      </div>`;
  }

  function exercisesHtml(exercises, ownerId) {
    if (!exercises || !exercises.length) return "";
    const items = exercises.map((ex, idx) => {
      let interactive = "";
      if (ex.type === "terminal") interactive = terminalHtml(ex, `fterm-${ownerId}-${idx}`);
      else if (ex.type === "quiz") interactive = quizHtml(ex, `quiz-${ownerId}-${idx}`);
      else if (ex.type === "fillin") interactive = fillinHtml(ex, `fillin-${ownerId}-${idx}`);

      // Le terminal garde une correction repliable à part (utile même une
      // fois l'exercice réussi) ; QCM et réponse-à-saisir affichent leur
      // correction automatiquement dès qu'on répond, pas besoin de la
      // redemander séparément.
      const reveal = ex.type === "quiz" || ex.type === "fillin" ? "" : `
        <details class="exercise-reveal">
          <summary>${t("seeCorrection")}</summary>
          <div class="exercise-correction-body">${escapeHtml(ex.correction)}</div>
        </details>`;

      return `
        <div class="exercise">
          <p class="exercise-instruction">📝 ${escapeHtml(ex.instruction)}</p>
          ${interactive}
          ${reveal}
        </div>`;
    }).join("");
    return `
      <div class="exercises-block">
        ${items}
      </div>`;
  }

  // Attache les écouteurs sur chaque encadré interactif fraîchement rendu.
  function initExercises() {
    initTerminals();
    initQuizzes();
    initFillins();
  }

  function initQuizzes() {
    Object.keys(QUIZ_REGISTRY).forEach(quizId => {
      const root = document.getElementById(quizId);
      if (!root) return;
      const state = QUIZ_REGISTRY[quizId];
      const feedbackEl = root.querySelector(".quiz-feedback");
      root.querySelectorAll(".quiz-option").forEach(btn => {
        if (btn.dataset.wired) return;
        btn.dataset.wired = "1";
        btn.addEventListener("click", () => {
          if (state.answered) return;
          state.answered = true;
          const idx = parseInt(btn.dataset.idx, 10);
          root.querySelectorAll(".quiz-option").forEach((b, i) => {
            if (i === state.correctIndex) b.classList.add("correct");
            else if (i === idx) b.classList.add("incorrect");
          });
          const ok = idx === state.correctIndex;
          feedbackEl.innerHTML = `<span class="${ok ? "feedback-ok" : "feedback-ko"}">${ok ? t("quizCorrect") : t("quizIncorrect")}</span> ${escapeHtml(state.correction)}`;
          feedbackEl.classList.add("visible");
        });
      });
    });
  }

  function initFillins() {
    Object.keys(FILLIN_REGISTRY).forEach(fillId => {
      const root = document.getElementById(fillId);
      if (!root) return;
      const inputEl = root.querySelector(".fillin-input");
      const checkBtn = root.querySelector(".fillin-check");
      const feedbackEl = root.querySelector(".fillin-feedback");
      if (!inputEl || !checkBtn || checkBtn.dataset.wired) return;
      checkBtn.dataset.wired = "1";
      const state = FILLIN_REGISTRY[fillId];

      const check = () => {
        if (state.answered) return;
        const normalize = s => s.toLowerCase().replace(/\s+/g, " ").trim();
        const val = normalize(inputEl.value);
        const ok = val !== "" && state.accept.some(a => normalize(a) === val);
        state.answered = true;
        inputEl.disabled = true;
        checkBtn.disabled = true;
        root.classList.add(ok ? "fillin-correct" : "fillin-incorrect");
        feedbackEl.innerHTML = `<span class="${ok ? "feedback-ok" : "feedback-ko"}">${ok ? t("quizCorrect") : t("quizIncorrect")}</span> ${escapeHtml(state.correction)}`;
        feedbackEl.classList.add("visible");
      };

      checkBtn.addEventListener("click", check);
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); check(); }
      });
    });
  }

  function initTerminals() {
    Object.keys(TERMINAL_REGISTRY).forEach(termId => {
      const root = document.getElementById(termId);
      if (!root) return;
      const inputEl = root.querySelector(".fterm-input");
      const outputEl = root.querySelector(".fterm-output");
      if (!inputEl || !outputEl || inputEl.dataset.wired) return;
      inputEl.dataset.wired = "1";
      const state = TERMINAL_REGISTRY[termId];

      const appendLine = (text, cls) => {
        const line = document.createElement("div");
        line.className = "fterm-line" + (cls ? " " + cls : "");
        line.textContent = text;
        outputEl.appendChild(line);
        outputEl.scrollTop = outputEl.scrollHeight;
      };

      inputEl.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        const raw = inputEl.value.trim();
        if (!raw) return;
        appendLine("$ " + raw, "fterm-cmd");
        inputEl.value = "";
        if (state.stepIndex >= state.steps.length) return;

        const normalize = s => s.replace(/\s+/g, " ").trim();
        const cmd = normalize(raw);
        const step = state.steps[state.stepIndex];
        const expected = Array.isArray(step.expect) ? step.expect : [step.expect];
        const ok = expected.some(e => normalize(e) === cmd);

        if (ok) {
          if (step.output) appendLine(step.output, "fterm-out");
          state.stepIndex++;
          if (state.stepIndex >= state.steps.length) {
            appendLine(t("exerciseSuccess"), "fterm-success");
            root.classList.add("fterm-done");
          }
        } else {
          appendLine(
            state.hint ? t("exerciseHintPrefix", state.hint) : t("exerciseWrongCommand"),
            "fterm-error"
          );
        }
      });
    });
  }

  // Ligne cliquable dans la liste — ouvre la page dédiée de la fiche
  // (théorie puis, le cas échéant, exercices), plutôt qu'un accordéon.
  function guideCardHtml(item, featured = false) {
    const fav = isFavoriteFor("formation", item);
    const hasExercises = item.exercises && item.exercises.length > 0;
    const loc = localizedGuide(item);
    return `
      <div class="guide-card guide-card-row ${featured ? "featured" : ""}" data-cat="${escapeAttr(item.category)}" data-title="${escapeAttr(item.title)}" role="button" tabindex="0">
        <span class="guide-file-icon" aria-hidden="true"><span class="material-symbols-outlined">description</span></span>
        <div class="guide-row-top">
          <span class="guide-title">${escapeHtml(loc.title)}</span>
          ${item.level ? `<span class="guide-level ${levelClass(item.level)}">${escapeHtml(translateLevelText(levelText(item.level)))}</span>` : ""}
          ${hasExercises ? `<span class="exercise-flag" title="${escapeAttr(t("hasExercisesTitle"))}">🧪</span>` : ""}
          ${featured ? `<button class="open-guide">${lang === "fr" ? "Ouvrir la fiche" : "Open guide"}</button>` : ""}
          <button class="fav-btn material-symbols-outlined ${fav ? "active" : ""}" data-favtype="formation" data-favkey="${escapeAttr(favKeyFor("formation", item))}" title="${fav ? t("removeFav") : t("addFav")}">star</button>
        </div>
        <p class="guide-row-summary">${escapeHtml(loc.summary)}</p>
      </div>`;
  }

  function renderCommandResults() {
    const filtered = COMMANDS.filter(item =>
      (activeGroup === "Toutes" || groupOf(item.category) === activeGroup) &&
      (activeCategory === "Toutes" || item.category === activeCategory) &&
      (activeSubcategory === "Toutes" || item.subcategory === activeSubcategory) &&
      (!showFavoritesOnly || isFavoriteFor("commands", item)) &&
      matchesCommand(item, query)
    );

    if (filtered.length === 0) {
      resultsEl.innerHTML = showFavoritesOnly
        ? `<div class="empty">${t("emptyCommandsFav")}</div>`
        : `<div class="empty">${t("emptyCommands")}</div>`;
      return;
    }

    // group by category, then by subcategory (if present), in the order they first appear
    const grouped = {};
    filtered.forEach(item => {
      const catBucket = (grouped[item.category] = grouped[item.category] || { __order: [], subs: {} });
      const subKey = item.subcategory || "__none";
      if (!catBucket.subs[subKey]) {
        catBucket.subs[subKey] = [];
        catBucket.__order.push(subKey);
      }
      catBucket.subs[subKey].push(item);
    });

    let html = "";
    Object.keys(grouped).forEach(cat => {
      html += `<div class="group-title">${escapeHtml(catLabel(cat))}</div>`;
      const catBucket = grouped[cat];
      catBucket.__order.forEach(subKey => {
        if (subKey !== "__none") {
          html += `<div class="subgroup-title">${escapeHtml(subcatLabel(subKey))}</div>`;
        }
        catBucket.subs[subKey].forEach((item, idx) => {
          html += commandCardHtml(item, `${cat}-${subKey}-${idx}`);
        });
      });
    });
    resultsEl.innerHTML = html;
  }

  function renderGuideResults() {
    const filtered = GUIDES.filter(item =>
      (activeGroup === "Toutes" || groupOf(item.category) === activeGroup) &&
      (activeCategory === "Toutes" || item.category === activeCategory) &&
      (activeLevel === "Toutes" || item.level === activeLevel) &&
      (activeSubcategory === "Toutes" || item.subcategory === activeSubcategory) &&
      (!showFavoritesOnly || isFavoriteFor("formation", item)) &&
      matchesGuide(item, query)
    );

    if (filtered.length === 0) {
      resultsEl.innerHTML = showFavoritesOnly
        ? `<div class="empty">${t("emptyFormationFav")}</div>`
        : `<div class="empty">${t("emptyFormation")}</div>`;
      return;
    }

    if (activeCategory === "Git" && !query.trim()) {
      const sections = [
        { name: lang === "fr" ? "Les bases" : "The basics", description: lang === "fr" ? "Comprendre ce qu’est Git et réaliser tes premières actions en toute confiance." : "Understand Git and take your first steps with confidence.", titles: ["Git, à quoi ça sert vraiment ?", "Local vs distant : ce qui se passe vraiment à chaque étape", "Le workflow du quotidien"] },
        { name: lang === "fr" ? "Travailler au quotidien" : "Everyday workflow", description: lang === "fr" ? "Apprendre les commandes essentielles pour gérer ton travail efficacement." : "Learn the essential commands for everyday work.", titles: ["Annuler une erreur sans paniquer", ".gitignore : ne pas tout versionner", "Lire l'historique : git log, HEAD, SHA"] },
        { name: lang === "fr" ? "Collaborer" : "Collaborate", description: lang === "fr" ? "Découvrir comment partager ton code et travailler avec d’autres développeurs." : "Share your code and work with other developers.", titles: ["Les branches : travailler sans tout casser", "Les conflits de fusion (merge conflicts)", "Pull Request : la collaboration sur GitHub"] }
      ];
      let html = "";
      sections.forEach(section => {
        const items = section.titles.map(title => filtered.find(item => item.title === title)).filter(Boolean);
        if (!items.length) return;
        html += `<div class="level-title">${escapeHtml(section.name)}</div>`;
        html += `<p class="section-description">${escapeHtml(section.description)}</p>`;
        html += items.map((item, index) => guideCardHtml(item, section === sections[0] && index === 0)).join("");
      });
      resultsEl.innerHTML = html;
      return;
    }

    // Une fiche sans niveau (ex : Skills & Agents) n'entre pas dans le
    // classement vert/jaune/rouge — elle est groupée à part, par catégorie
    // puis sous-catégorie, plutôt que d'être invisible dans ce groupage.
    const leveled = filtered.filter(g => LEVEL_ORDER.includes(g.level));
    const unleveled = filtered.filter(g => !LEVEL_ORDER.includes(g.level));

    // groupé par niveau (vert → jaune → rouge), puis par thème à l'intérieur
    const levelsPresent = LEVEL_ORDER.filter(lvl => leveled.some(g => g.level === lvl));
    const grouped = {};
    levelsPresent.forEach(lvl => {
      grouped[lvl] = {};
      leveled.filter(g => g.level === lvl).forEach(item => {
        (grouped[lvl][item.category] = grouped[lvl][item.category] || []).push(item);
      });
    });

    let html = "";
    levelsPresent.forEach(lvl => {
      html += `<div class="level-title ${levelClass(lvl)}">${escapeHtml(translateLevelText(levelText(lvl)))}</div>`;
      Object.keys(grouped[lvl]).forEach(cat => {
        html += `<div class="subgroup-title">${escapeHtml(catLabel(cat))}</div>`;
        grouped[lvl][cat].forEach(item => {
          html += guideCardHtml(item);
        });
      });
    });

    if (unleveled.length) {
      const byCat = {};
      unleveled.forEach(item => {
        const catBucket = (byCat[item.category] = byCat[item.category] || { __order: [], subs: {} });
        const subKey = item.subcategory || "__none";
        if (!catBucket.subs[subKey]) { catBucket.subs[subKey] = []; catBucket.__order.push(subKey); }
        catBucket.subs[subKey].push(item);
      });
      Object.keys(byCat).forEach(cat => {
        html += `<div class="group-title">${escapeHtml(catLabel(cat))}</div>`;
        byCat[cat].__order.forEach(subKey => {
          if (subKey !== "__none") {
            html += `<div class="subgroup-title">${escapeHtml(subcatLabel(subKey))}</div>`;
          }
          byCat[cat].subs[subKey].forEach(item => {
            html += guideCardHtml(item);
          });
        });
      });
    }

    resultsEl.innerHTML = html;
  }

  function renderTransversalResults() {
    const cmdMatches = COMMANDS.filter(item => (!showFavoritesOnly || isFavoriteFor("commands", item)) && matchesCommand(item, query));
    const guideMatches = GUIDES.filter(item => (!showFavoritesOnly || isFavoriteFor("formation", item)) && matchesGuide(item, query));

    if (cmdMatches.length === 0 && guideMatches.length === 0) {
      resultsEl.innerHTML = `<div class="empty">${t("emptyBoth")}</div>`;
      return;
    }

    let html = "";
    if (cmdMatches.length > 0) {
      html += `<div class="group-title">🧰 ${t("modeCommands")} (${cmdMatches.length})</div>`;
      cmdMatches.forEach((item, idx) => {
        html += commandCardHtml(item, `search-cmd-${idx}`);
      });
    }
    if (guideMatches.length > 0) {
      html += `<div class="group-title">📘 ${t("modeFormation")} (${guideMatches.length})</div>`;
      guideMatches.forEach(item => {
        html += guideCardHtml(item);
      });
    }
    resultsEl.innerHTML = html;
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    }
    return fallbackCopy(text);
  }

  function fallbackCopy(text) {
    return new Promise((resolve) => {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      resolve();
    });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, s => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[s]));
  }
  function escapeAttr(str) { return escapeHtml(str); }

  // --- Liens internes entre fiches Formation : [[Catégorie::Titre]] ------
  // Commande entre backticks dans le texte d'une fiche : toujours stylée
  // comme dans Commandes ; cliquable et menant directement à la carte
  // uniquement quand cette commande exacte y existe (COMMAND_BY_CMD).
  // Backtick `code` (stylé, lié à une carte Commandes si elle existe) OU
  // lien markdown [texte](url) (vrai lien externe, nouvel onglet) — les deux
  // formats coexistent dans le texte d'une fiche, traités en un seul passage.
  function renderInlineCode(segment) {
    const re = /`([^`]+)`|\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g;
    let out = "";
    let last = 0;
    let m;
    while ((m = re.exec(segment)) !== null) {
      out += escapeHtml(segment.slice(last, m.index));
      if (m[1] !== undefined) {
        const code = m[1];
        const cmd = COMMAND_BY_CMD.get(code);
        out += cmd
          ? `<a href="#" class="inline-cmd" data-command-category="${escapeAttr(cmd.category)}" data-command-title="${escapeAttr(cmd.title)}">${escapeHtml(code)}</a>`
          : `<code class="inline-cmd">${escapeHtml(code)}</code>`;
      } else {
        out += `<a href="${escapeAttr(m[3])}" class="external-link" target="_blank" rel="noopener noreferrer">${escapeHtml(m[2])}</a>`;
      }
      last = re.lastIndex;
    }
    out += escapeHtml(segment.slice(last));
    return out;
  }

  function renderGuideParagraph(text) {
    const re = /\[\[([^:\]]+)::([^\]]+)\]\]/g;
    let out = "";
    let last = 0;
    let m;
    while ((m = re.exec(text)) !== null) {
      out += renderInlineCode(text.slice(last, m.index));
      const cat = m[1], title = m[2];
      // data-cat/data-title restent le titre FRANÇAIS canonique (identité de
      // la fiche, sert à la navigation) ; seul le texte affiché du lien est
      // traduit s'il existe une version anglaise de la fiche ciblée.
      const targetTr = guideTranslation(cat, title);
      const label = targetTr && targetTr.title ? targetTr.title : title;
      out += `<a href="#" class="guide-link" data-cat="${escapeAttr(cat)}" data-title="${escapeAttr(title)}">${escapeHtml(label)}</a>`;
      last = re.lastIndex;
    }
    out += renderInlineCode(text.slice(last));
    return out;
  }

  function hashStr(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }
  function guideDomId(item) {
    return "guide-" + hashStr(`${item.category}|${item.title}`);
  }

  function navigateToGuide(cat, title) {
    const target = GUIDES.find(g => g.category === cat && g.title === title);
    if (!target) return;
    mode = "formation";
    openGuideDetail(target);
  }

  // Délégation unique : marche pour toutes les cartes, quel que soit
  // l'endroit où elles sont rendues (parcours par onglet ou recherche
  // transversale), sans avoir à ré-attacher des écouteurs à chaque rendu.
  resultsEl.addEventListener("click", (e) => {
    const link = e.target.closest(".guide-link");
    if (link) {
      e.preventDefault();
      navigateToGuide(link.dataset.cat, link.dataset.title);
      return;
    }

    const cmdLink = e.target.closest("a.inline-cmd");
    if (cmdLink) {
      e.preventDefault();
      navigateToCommand(cmdLink.dataset.commandCategory, cmdLink.dataset.commandTitle);
      return;
    }

    const favBtn = e.target.closest(".fav-btn");
    if (favBtn) {
      e.preventDefault();
      e.stopPropagation(); // évite de (dé)plier une fiche Formation au clic sur son étoile
      toggleFavoriteFor(favBtn.dataset.favtype, favBtn.dataset.favkey);
      renderResults();
      return;
    }

    const copyBtn = e.target.closest(".copy-btn");
    if (copyBtn) {
      const id = copyBtn.dataset.id;
      const text = document.getElementById(`cmd-${id}`).textContent;
      copyToClipboard(text).then(() => {
        const original = copyBtn.textContent;
        copyBtn.textContent = t("copied");
        copyBtn.classList.add("copied");
        setTimeout(() => {
          copyBtn.textContent = original;
          copyBtn.classList.remove("copied");
        }, 1200);
      });
      return;
    }

    const actionBtn = e.target.closest("[data-action]");
    if (actionBtn) {
      const action = actionBtn.dataset.action;
      if (action === "back-to-list") closeGuideDetail();
      else if (action === "go-exercises") { guideStep = "exercises"; renderResults(); window.scrollTo({ top: 0, behavior: "smooth" }); }
      else if (action === "back-to-theory") { guideStep = "theory"; renderResults(); window.scrollTo({ top: 0, behavior: "smooth" }); }
      return;
    }

    const guideRow = e.target.closest(".guide-card-row");
    if (guideRow) {
      const target = GUIDES.find(g => g.category === guideRow.dataset.cat && g.title === guideRow.dataset.title);
      if (target) openGuideDetail(target);
    }
  });

  resultsEl.addEventListener("keydown", (e) => {
    if ((e.key !== "Enter" && e.key !== " ") || e.target.closest("button, a")) return;
    const guideRow = e.target.closest(".guide-card-row");
    if (!guideRow) return;
    e.preventDefault();
    const target = GUIDES.find(g => g.category === guideRow.dataset.cat && g.title === guideRow.dataset.title);
    if (target) openGuideDetail(target);
  });

  searchInput.addEventListener("input", (e) => {
    if (openGuide) {
      openGuide = null;
      renderSubchips();
    }
    query = e.target.value;
    saveState();
    renderResults();
  });

  document.addEventListener("keydown", (e) => {
    if (openGuide) {
      if (e.key === "Escape") closeGuideDetail();
      return;
    }
    if (e.key === "/" && document.activeElement !== searchInput) {
      e.preventDefault();
      searchInput.focus();
    }
    if (e.key === "Escape") {
      searchInput.value = "";
      query = "";
      saveState();
      searchInput.blur();
      renderResults();
    }
  });

  favToggleEl.addEventListener("click", () => {
    showFavoritesOnly = !showFavoritesOnly;
    saveState();
    renderResults();
  });

  modeTabsEl.querySelectorAll(".mode-tab").forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.dataset.mode === mode) return;
      mode = btn.dataset.mode;
      activeGroup = "Toutes";
      expandedGroup = null;
      activeCategory = "Toutes";
      activeSubcategory = "Toutes";
      activeLevel = "Toutes";
      query = "";
      searchInput.value = "";
      saveState();
      renderModeTabs();
      renderGroupChips();
      renderChips();
      renderSubchips();
      renderResults();
    });
  });

  // --- Restauration du dernier état avant le tout premier rendu ---
  restoreState();
  searchInput.value = query;
  applyLang();
  renderModeTabs();
  renderGroupChips();
  renderChips();
  renderSubchips();
  renderResults();
</script>
