<meta charset="UTF-8">
<title>Command Hub</title>
<style>
  :root {
    --bg: #f5f5f7;
    --bg-elevated: #ffffff;
    --border: #e2e2e6;
    --text: #1c1c1f;
    --text-dim: #6b6b74;
    --accent: #6d5efc;
    --accent-text: #ffffff;
    --code-bg: #f0eefe;
    --code-text: #4a3fc9;
    --chip-bg: #ececf1;
    --chip-active-bg: #6d5efc;
    --chip-active-text: #ffffff;
    --danger: #d64545;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 10px rgba(0,0,0,.03);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171b;
      --bg-elevated: #201f26;
      --border: #302f38;
      --text: #eceaf5;
      --text-dim: #94919f;
      --accent: #8f7dff;
      --accent-text: #17171b;
      --code-bg: #262233;
      --code-text: #b9adff;
      --chip-bg: #2a2932;
      --chip-active-bg: #8f7dff;
      --chip-active-text: #17171b;
      --danger: #ff8080;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    }
  }
  /* Bascule manuelle : force le thème quel que soit le système */
  :root[data-theme="dark"] {
    --bg: #17171b;
    --bg-elevated: #201f26;
    --border: #302f38;
    --text: #eceaf5;
    --text-dim: #94919f;
    --accent: #8f7dff;
    --accent-text: #17171b;
    --code-bg: #262233;
    --code-text: #b9adff;
    --chip-bg: #2a2932;
    --chip-active-bg: #8f7dff;
    --chip-active-text: #17171b;
    --danger: #ff8080;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  header h1 {
    font-size: 22px;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header p {
    color: var(--text-dim);
    margin: 0 0 4px;
    font-size: 14px;
  }
  .stats-line {
    color: var(--text-dim);
    font-size: 12.5px;
    margin: 0 0 22px;
  }
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 18px;
  }
  .theme-toggle {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: var(--shadow);
    white-space: nowrap;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .top-row-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .lang-toggle {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: var(--shadow);
    white-space: nowrap;
  }
  .lang-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .lang-gate {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    padding: 20px;
  }
  .lang-gate-card {
    max-width: 360px;
    width: 100%;
    text-align: center;
  }
  .lang-gate-logo { font-size: 40px; margin-bottom: 10px; }
  .lang-gate-card h1 {
    font-size: 22px;
    margin: 0 0 8px;
  }
  .lang-gate-card p {
    color: var(--text-dim);
    font-size: 14px;
    margin: 0 0 24px;
  }
  .lang-gate-buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .lang-choice {
    padding: 14px 18px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .lang-choice:hover { border-color: var(--accent); color: var(--accent); }
  .translation-notice {
    background: var(--code-bg);
    color: var(--code-text);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 18px;
    line-height: 1.4;
  }
  .search-bar {
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: 8px 0 14px;
    z-index: 10;
  }
  #search {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text);
    outline: none;
    box-shadow: var(--shadow);
  }
  #search:focus { border-color: var(--accent); }
  .search-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }
  .search-row #search { flex: 1; }
  .fav-toggle {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow);
    white-space: nowrap;
  }
  .fav-toggle.active {
    border-color: #d6a326;
    color: #d6a326;
    background: color-mix(in srgb, #d6a326 12%, var(--bg-elevated));
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .groupchips {
    margin-top: 12px;
    margin-bottom: -2px;
  }
  .group-chip {
    font-weight: 600;
    padding: 7px 15px;
  }
  .subchips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
  }
  .chip {
    display: inline-flex;
    align-items: center;
    padding: 6px 13px;
    border-radius: 999px;
    background: var(--chip-bg);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .subchips .chip {
    padding: 4px 11px;
    font-size: 12px;
    background: transparent;
    border: 1px solid var(--border);
  }
  .chip.active {
    background: var(--chip-active-bg);
    color: var(--chip-active-text);
    font-weight: 600;
  }
  .subchips .chip.active {
    border-color: var(--accent);
  }
  .search-hint {
    margin-top: 12px;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .related-line {
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .related-line .guide-link { font-size: inherit; }
  .count-badge {
    opacity: .65;
    font-weight: 400;
    margin-left: 3px;
  }
  .group-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--text-dim);
    margin: 28px 0 10px;
    font-weight: 600;
  }
  .group-title:first-of-type { margin-top: 18px; }
  .subgroup-title {
    font-size: 12px;
    color: var(--accent);
    margin: 18px 0 8px 2px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .subgroup-title::before {
    content: "";
    width: 10px;
    height: 1px;
    background: var(--accent);
    opacity: .5;
  }
  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .card-title-row {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .card-title {
    font-weight: 600;
    font-size: 14.5px;
  }
  .card-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .fav-btn {
    flex-shrink: 0;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 16px;
    line-height: 1;
    padding: 4px;
    cursor: pointer;
    border-radius: 6px;
  }
  .fav-btn:hover { color: #d6a326; }
  .fav-btn.active { color: #d6a326; }
  .copy-btn {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text-dim);
    font-size: 12.5px;
    padding: 5px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy-btn.copied {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }
  pre.cmd {
    margin: 8px 0;
    padding: 10px 12px;
    background: var(--code-bg);
    color: var(--code-text);
    border-radius: 9px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 13px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .desc {
    font-size: 13px;
    color: var(--text-dim);
    margin: 6px 0 0;
    line-height: 1.4;
  }
  .tags {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .tag {
    font-size: 11px;
    color: var(--text-dim);
    background: var(--chip-bg);
    padding: 2px 8px;
    border-radius: 999px;
  }
  .empty {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 0;
    font-size: 14px;
  }
  kbd {
    background: var(--chip-bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 6px;
    font-size: 11.5px;
    font-family: inherit;
  }
  .mode-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    background: var(--chip-bg);
    padding: 4px;
    border-radius: 12px;
    width: fit-content;
  }
  .mode-tab {
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 13.5px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 9px;
    cursor: pointer;
    font-family: inherit;
  }
  .mode-tab.active {
    background: var(--bg-elevated);
    color: var(--text);
    box-shadow: var(--shadow);
  }
  /* --- Liste des fiches Formation (lignes cliquables) --- */
  .guide-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
  }
  .guide-card-row {
    cursor: pointer;
    transition: border-color .15s;
  }
  .guide-card-row:hover { border-color: var(--accent); }
  .guide-row-top {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .guide-row-top::after {
    content: "›";
    color: var(--text-dim);
    font-size: 18px;
    line-height: 1;
    flex-shrink: 0;
  }
  .guide-row-top .guide-title { margin-right: auto; }
  .exercise-flag { font-size: 12px; flex-shrink: 0; }
  .guide-row-summary {
    font-size: 13px;
    color: var(--text-dim);
    margin: 6px 0 0 14px;
    line-height: 1.4;
  }
  .guide-dot {
    width: 8px;
    height: 8px;
    min-width: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--border);
  }
  .guide-dot.lvl-green { background: #3aa76d; }
  .guide-dot.lvl-yellow { background: #d6a326; }
  .guide-dot.lvl-red { background: var(--danger); }
  /* Même échelle d'espacement (6px) que .subgroup-title, .card-title-row,
     .fav-toggle, .mode-tabs — la pastille suit la même règle "icône + texte"
     que partout ailleurs dans le site. */
  .chip .guide-dot { margin-right: 6px; }
  .guide-title {
    font-weight: 600;
    font-size: 14.5px;
  }

  /* --- Page dédiée d'une fiche (théorie → exercices) --- */
  .guide-detail {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 24px 26px;
    box-shadow: var(--shadow);
  }
  .back-btn {
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    padding: 0;
    margin-bottom: 18px;
  }
  .back-btn:hover { color: var(--accent); }
  .detail-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .detail-title {
    font-size: 19px;
    margin: 0;
    margin-right: auto;
    letter-spacing: -.01em;
  }
  .detail-summary {
    font-size: 13.5px;
    color: var(--text-dim);
    line-height: 1.5;
    margin: 0 0 20px;
  }
  .detail-steps {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
  }
  .detail-step {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .05em;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--chip-bg);
    color: var(--text-dim);
  }
  .detail-step.active {
    background: var(--chip-active-bg);
    color: var(--chip-active-text);
  }
  .guide-section {
    margin-top: 14px;
  }
  .guide-section:first-of-type { margin-top: 0; }
  .guide-section h4 {
    font-size: 13px;
    margin: 0 0 6px;
    color: var(--accent);
  }
  .guide-section p {
    font-size: 13.5px;
    line-height: 1.55;
    margin: 0 0 8px;
    white-space: pre-line;
  }
  .guide-section p:last-child { margin-bottom: 0; }
  .next-step-btn {
    display: block;
    margin: 24px 0 0;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-text);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .next-step-btn.secondary {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .next-step-btn:hover { opacity: .9; }
  .no-exercises-note {
    margin: 22px 0 0;
    font-size: 13px;
    color: var(--text-dim);
    font-style: italic;
  }
  .exercises-block {
    margin-top: 0;
  }
  .exercise {
    margin-bottom: 18px;
  }
  .exercise:last-child { margin-bottom: 0; }
  .exercise-instruction {
    font-size: 13.5px;
    line-height: 1.55;
    margin: 0 0 10px;
  }
  .fterm {
    background: #17171b;
    border-radius: 10px;
    padding: 10px 12px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 12.5px;
    margin-bottom: 8px;
  }
  .fterm-output {
    max-height: 220px;
    overflow-y: auto;
    color: #d7d7dc;
  }
  .fterm-line {
    padding: 1px 0;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .fterm-line.fterm-cmd { color: #a99bff; }
  .fterm-line.fterm-error { color: #ff8f8f; }
  .fterm-line.fterm-success { color: #6fd39a; font-weight: 600; }
  .fterm-inputline {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
  }
  .fterm-prompt { color: #6fd39a; flex-shrink: 0; }
  .fterm-input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: #eceaf5;
    font-family: inherit;
    font-size: inherit;
  }
  .fterm.fterm-done { box-shadow: inset 0 0 0 1px #3aa76d; }
  .exercise-reveal summary {
    cursor: pointer;
    font-size: 12.5px;
    color: var(--accent);
    font-weight: 600;
    list-style: none;
  }
  .exercise-reveal summary::-webkit-details-marker { display: none; }
  .exercise-reveal summary::before { content: "💡 "; }
  .exercise-reveal[open] summary::before { content: "✅ "; }
  .exercise-correction-body {
    margin-top: 8px;
    padding: 10px 12px;
    background: var(--code-bg);
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text);
    white-space: pre-line;
  }
  /* --- QCM --- */
  .quiz-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .quiz-option {
    text-align: left;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    cursor: pointer;
  }
  .quiz-option:hover:not(:disabled) { border-color: var(--accent); }
  .quiz-option:disabled { cursor: default; }
  .quiz-option.correct {
    border-color: #3aa76d;
    background: color-mix(in srgb, #3aa76d 14%, var(--bg-elevated));
    font-weight: 600;
  }
  .quiz-option.incorrect {
    border-color: var(--danger);
    background: color-mix(in srgb, var(--danger) 14%, var(--bg-elevated));
  }
  /* --- Réponse à saisir --- */
  .fillin-row {
    display: flex;
    gap: 8px;
  }
  .fillin-input {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text);
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 13px;
    outline: none;
  }
  .fillin-input:focus { border-color: var(--accent); }
  .fillin-input:disabled { opacity: .75; }
  .fillin-check {
    flex-shrink: 0;
    padding: 0 16px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .fillin-check:disabled { opacity: .6; cursor: default; }
  .fillin.fillin-correct .fillin-input { border-color: #3aa76d; }
  .fillin.fillin-incorrect .fillin-input { border-color: var(--danger); }
  /* --- Commun QCM / réponse à saisir --- */
  .quiz-feedback, .fillin-feedback {
    margin-top: 10px;
    font-size: 13px;
    line-height: 1.5;
    display: none;
  }
  .quiz-feedback.visible, .fillin-feedback.visible { display: block; }
  .feedback-ok { color: #3aa76d; font-weight: 600; }
  .feedback-ko { color: var(--danger); font-weight: 600; }
  .guide-link {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent);
    cursor: pointer;
  }
  .guide-link:hover { text-decoration-color: var(--accent); }
  /* Commande citée dans le texte d'une fiche Formation : même design que
     pre.cmd dans les cartes Commandes, en version inline. */
  .inline-cmd {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 0.9em;
    background: var(--code-bg);
    color: var(--code-text);
    padding: 1px 6px;
    border-radius: 5px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  /* Variante cliquable : la commande citée existe aussi comme carte dans
     Commandes — clic = y sauter directement, plutôt qu'un simple style. */
  a.inline-cmd {
    cursor: pointer;
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  }
  a.inline-cmd:hover {
    border-color: var(--accent);
  }
  /* Brève mise en évidence de la carte visée après un clic sur un lien
     de commande depuis une fiche Formation. */
  .card.landed {
    animation: card-landed-flash 1.6s ease-out;
  }
  @keyframes card-landed-flash {
    0% { box-shadow: 0 0 0 2px var(--accent); }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  .level-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--text-dim);
    margin: 28px 0 10px;
    font-weight: 600;

<script src="guides.js"></script>
<script src="guides.en.js"></script>
<script>
  const searchInput = document.getElementById("search");
  const groupChipsEl = document.getElementById("groupChips");
  const chipsEl = document.getElementById("chips");
  const subchipsEl = document.getElementById("subchips");
  const chipsWrapEl = document.getElementById("chipsWrap");
  const searchHintEl = document.getElementById("searchHint");
  const topRowEl = document.getElementById("topRow");
  const searchBarEl = document.getElementById("searchBar");
  const resultsEl = document.getElementById("results");
  const modeTabsEl = document.getElementById("modeTabs");
  const favToggleEl = document.getElementById("favToggle");
  const favToggleLabelEl = document.getElementById("favToggleLabel");
  const statsLineEl = document.getElementById("statsLine");
  const themeToggleEl = document.getElementById("themeToggle");
  const langGateEl = document.getElementById("langGate");
  const langToggleEl = document.getElementById("langToggle");
  const headerTaglineEl = document.getElementById("headerTagline");
  const modeTabCommandsLabelEl = document.getElementById("modeTabCommandsLabel");
  const modeTabFormationLabelEl = document.getElementById("modeTabFormationLabel");

  const LEVEL_ORDER = ["🟢 Débutant", "🟡 Intermédiaire", "🔴 Avancé"];

  // --- Lien direct commande citée dans une fiche Formation -> carte Commandes ---
  // Clé = texte exact du champ cmd (identique FR/EN, jamais traduit) -> commande.
  // Alimente le rendu des `commandes citées` en texte de fiche (voir
  // renderGuideParagraph) : stylées comme dans Commandes, et cliquables
  // uniquement quand la commande existe réellement comme carte.
  const COMMAND_BY_CMD = new Map();
  COMMANDS.forEach(c => { if (!COMMAND_BY_CMD.has(c.cmd)) COMMAND_BY_CMD.set(c.cmd, c); });
  // Du plus long au plus court, pour faire correspondre en priorité la
  // commande la plus spécifique (évite qu'une sous-chaîne courte "gagne"
  // avant la commande complète qui la contient).
  const COMMAND_CMD_LIST = Array.from(COMMAND_BY_CMD.keys()).sort((a, b) => b.length - a.length);

  function navigateToCommand(category, title) {
    const target = COMMANDS.find(c => c.category === category && c.title === title);
    if (!target) return;
    mode = "commands";
    openGuide = null;
    query = "";
    searchInput.value = "";
    activeGroup = groupOf(category);
    activeCategory = category;
    activeSubcategory = "Toutes";
    saveState();
    renderModeTabs();
    renderGroupChips();
    renderChips();
    renderSubchips();
    renderResults();
    requestAnimationFrame(() => {
      const el = resultsEl.querySelector(`.card[data-command-category="${cssEscape(category)}"][data-command-title="${cssEscape(title)}"]`);
      if (!el) return;
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      el.classList.remove("landed");
      void el.offsetWidth; // force le redémarrage de l'animation si déjà jouée
      el.classList.add("landed");
    });
  }

  function cssEscape(s) {
    return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\\]]/g, "\\$&");
  }
  const STATE_KEY = "cmdhub_state_v1";
  const FAV_KEY = "cmdhub_favorites_v1";
  const THEME_KEY = "cmdhub_theme_v1";
  const LANG_KEY = "cmdhub_lang_v1";

  // --- Langue (FR / EN) ---------------------------------------------------
  const UI_STRINGS = {
    fr: {
      tagline: "Toutes tes commandes et fiches de formation — Claude Code, Codex, Linux, Windows, Git, Kotlin/Android, Expo/React Native — au même endroit. Tape pour chercher, clique pour copier.",
      statsLine: (n, m) => `${n} commandes · ${m} fiches de formation`,
      modeCommands: "Commandes",
      modeFormation: "Formation",
      searchPlaceholderCommands: "Rechercher une commande, un tag, une description… (touche /)",
      searchPlaceholderFormation: "Rechercher une notion, un thème… (touche /)",
      favLabel: (n) => `Favoris (${n})`,
      favToggleTitle: "N'afficher que mes favoris",
      themeToggleTitle: "Changer le thème",
      langToggleLabel: "🌐 EN",
      searchHint: "🔍 Recherche simultanée dans Commandes et Formation — les filtres reprennent une fois la recherche effacée",
      emptyCommands: "Aucune commande ne correspond 🤷",
      emptyCommandsFav: "Aucun favori ici — clique sur ☆ à côté d'une commande pour l'ajouter ⭐",
      emptyFormation: "Aucune fiche ne correspond 🤷",
      emptyFormationFav: "Aucun favori ici — clique sur ☆ à côté d'une fiche pour l'ajouter ⭐",
      emptyBoth: "Rien ne correspond, ni dans les commandes ni dans la formation 🤷",
      copy: "Copier",
      copied: "Copié ✓",
      forUnderstanding: "📘 Pour comprendre :",
      removeFav: "Retirer des favoris",
      addFav: "Ajouter aux favoris",
      backToList: "← Retour à la liste",
      stepTheory: "1. Théorie",
      stepExercises: "2. Exercices",
      goExercises: "Passer aux exercices →",
      noExercisesNote: "Pas encore d'exercices pratiques pour cette fiche.",
      backToTheory: "← Retour à la théorie",
      seeCorrection: "Voir la correction",
      terminalPlaceholder: "tape une commande…",
      fillinPlaceholder: "Ta réponse…",
      fillinCheck: "Vérifier",
      exerciseSuccess: "✅ Exercice réussi !",
      exerciseWrongCommand: "Commande non reconnue pour cet exercice, réessaie.",
      exerciseHintPrefix: (hint) => `Pas tout à fait — indice : ${hint}`,
      quizCorrect: "✅ Exact !",
      quizIncorrect: "❌ Pas tout à fait.",
      formationNotice: "🚧 La Formation n'est pas encore traduite en anglais — le contenu ci-dessous reste en français.",
      langGateTitle: "Choisis ta langue / Choose your language",
      allChip: "Toutes",
      hasExercisesTitle: "Contient des exercices pratiques"
    },
    en: {
      tagline: "All your commands and learning guides — Claude Code, Codex, Linux, Windows, Git, Kotlin/Android, Expo/React Native — in one place. Type to search, click to copy.",
      statsLine: (n, m) => `${n} commands · ${m} learning guides`,
      modeCommands: "Commands",
      modeFormation: "Learn",
      searchPlaceholderCommands: "Search a command, tag, description… (press /)",
      searchPlaceholderFormation: "Search a topic, a concept… (press /)",
      favLabel: (n) => `Favorites (${n})`,
      favToggleTitle: "Show favorites only",
      themeToggleTitle: "Change theme",
      langToggleLabel: "🌐 FR",
      searchHint: "🔍 Searching Commands and Learn at the same time — filters come back once the search is cleared",
      emptyCommands: "No command matches 🤷",
      emptyCommandsFav: "No favorites here yet — click ☆ next to a command to add it ⭐",
      emptyFormation: "No guide matches 🤷",
      emptyFormationFav: "No favorites here yet — click ☆ next to a guide to add it ⭐",
      emptyBoth: "Nothing matches, neither in commands nor in the learning guides 🤷",
      copy: "Copy",
      copied: "Copied ✓",
      forUnderstanding: "📘 To understand this:",
      removeFav: "Remove from favorites",
      addFav: "Add to favorites",
      backToList: "← Back to list",
      stepTheory: "1. Theory",
      stepExercises: "2. Exercises",
      goExercises: "Go to exercises →",
      noExercisesNote: "No practice exercises for this guide yet.",
      backToTheory: "← Back to theory",
      seeCorrection: "See the answer",
      terminalPlaceholder: "type a command…",
      fillinPlaceholder: "Your answer…",
      fillinCheck: "Check",
      exerciseSuccess: "✅ Exercise complete!",
      exerciseWrongCommand: "That command isn't expected here, try again.",
      exerciseHintPrefix: (hint) => `Not quite — hint: ${hint}`,
      quizCorrect: "✅ Correct!",
      quizIncorrect: "❌ Not quite.",
      formationNotice: "🚧 The Learn section isn't translated to English yet — the content below is still in French.",
      langGateTitle: "Choose your language / Choisis ta langue",
      allChip: "All",
      hasExercisesTitle: "Has practice exercises"
    }
  };

  let lang = "fr";
  try {
    const savedLang = localStorage.getItem(LANG_KEY);
    if (savedLang === "fr" || savedLang === "en") lang = savedLang;
  } catch (e) {}

  function t(key, ...args) {
    const entry = (UI_STRINGS[lang] && UI_STRINGS[lang][key] !== undefined) ? UI_STRINGS[lang][key] : UI_STRINGS.fr[key];
    return typeof entry === "function" ? entry(...args) : entry;
  }

  const LEVEL_LABELS = {
    fr: { "Débutant": "Débutant", "Intermédiaire": "Intermédiaire", "Avancé": "Avancé" },
    en: { "Débutant": "Beginner", "Intermédiaire": "Intermediate", "Avancé": "Advanced" }
  };
  function translateLevelText(text) {
    return (LEVEL_LABELS[lang] && LEVEL_LABELS[lang][text]) || text;
  }

  const CATEGORY_LABELS = {
    en: {
      "Bases du terminal": "Terminal basics",
      "Programmation": "Programming",
      "Git": "Git",
      "Expo / React Native": "Expo / React Native",
      "Kotlin / Android": "Kotlin / Android",
      "Linux Mint": "Linux Mint",
      "Linux": "Linux",
      "Windows": "Windows",
      "Docker": "Docker",
      "FAQ : erreurs fréquentes": "FAQ: common errors",
      "Claude Code": "Claude Code",
      "Codex": "Codex",
      "VS Code": "VS Code",
      "Cursor": "Cursor"
    }
  };

  // --- Regroupement des catégories en 3 grands groupes ------------------
  // Chaque catégorie (commands.js ET guides.js) appartient à un seul groupe.
  // Une catégorie absente de cette table retombe sur "Développement" (filet
  // de sécurité si une nouvelle catégorie est ajoutée sans être classée).
  const CATEGORY_GROUPS_ORDER = ["Application", "Système", "Développement"];
  const CATEGORY_TO_GROUP = {
    "Kotlin / Android": "Application",
    "Expo / React Native": "Application",
    "Linux": "Système",
    "Linux Mint": "Système",
    "Bases du terminal": "Système",
    "Docker": "Système",
    "Windows": "Système",
    "Claude Code": "Développement",
    "Codex": "Développement",
    "VS Code": "Développement",
    "Cursor": "Développement",
    "Git": "Développement",
    "Programmation": "Développement",
    "FAQ : erreurs fréquentes": "Développement"
  };
  const GROUP_LABELS = {
    en: { "Application": "Apps", "Système": "System", "Développement": "Development" }
  };
  function groupOf(cat) {
    return CATEGORY_TO_GROUP[cat] || "Développement";
  }
  function groupLabel(g) {
    return (GROUP_LABELS[lang] && GROUP_LABELS[lang][g]) || g;
  }
  function groupsFor(list) {
    const present = new Set(list.map(c => groupOf(c.category)));
    return ["Toutes", ...CATEGORY_GROUPS_ORDER.filter(g => present.has(g))];
  }
  const SUBCATEGORY_LABELS = {
    en: {
      "Fichiers & disque": "Files & disk",
      "Processus & système": "Processes & system",
      "Réseau": "Network",
      "Paquets (apt / snap / flatpak)": "Packages (apt / snap / flatpak)",
      "Paquets (winget / choco)": "Packages (winget / choco)",
      "Authentification": "Authentication",
      "Édition": "Editing",
      "Débogage": "Debugging",
      "Git intégré": "Built-in Git",
      "Éditeur : raccourcis IA": "Editor: AI shortcuts",
      "Utilisateurs & permissions": "Users & permissions",
      "Outils CLI divers": "Misc CLI tools",
      "Démarrage & Dev": "Getting started & Dev",
      "Build local": "Local build",
      "EAS Build & Submit": "EAS Build & Submit",
      "EAS Update (OTA)": "EAS Update (OTA)",
      "Compte & credentials": "Account & credentials",
      "Diagnostic & config": "Diagnostics & config",
      "Gradle": "Gradle",
      "ADB": "ADB",
      "Émulateur": "Emulator",
      "Staging & Commit": "Staging & Commit",
      "Branches": "Branches",
      "Remote (push/pull/clone)": "Remote (push/pull/clone)",
      "Annuler & restaurer": "Undo & restore",
      "Stash": "Stash",
      "Historique & recherche": "History & search",
      "Tags & config": "Tags & config"
    }
  };
  function catLabel(cat) {
    return (CATEGORY_LABELS[lang] && CATEGORY_LABELS[lang][cat]) || cat;
  }
  function subcatLabel(sub) {
    return (SUBCATEGORY_LABELS[lang] && SUBCATEGORY_LABELS[lang][sub]) || sub;
  }

  function localizedCommand(item) {
    if (lang === "en") {
      const key = `${item.category}|${item.subcategory || ""}|${item.title}`;
      const tr = COMMAND_TRANSLATIONS_EN[key];
      if (tr) {
        return { title: tr.title || item.title, desc: tr.desc || item.desc, tags: tr.tags || item.tags };
      }
    }
    return { title: item.title, desc: item.desc, tags: item.tags };
  }

  function guideTranslation(cat, title) {
    return lang === "en" ? GUIDE_TRANSLATIONS_EN[`${cat}|${title}`] : null;
  }

  function localizedGuide(item) {
    const tr = guideTranslation(item.category, item.title);
    if (tr) {
      return {
        title: tr.title || item.title,
        summary: tr.summary || item.summary,
        content: tr.content || item.content,
        exercises: tr.exercises || item.exercises,
        translated: true
      };
    }
    return { title: item.title, summary: item.summary, content: item.content, exercises: item.exercises, translated: false };
  }

  // --- Thème (auto / clair / sombre) ------------------------------------
  const THEME_CYCLE = ["auto", "light", "dark"];
  const THEME_LABEL = { auto: "🖥️ Auto", light: "☀️ Clair", dark: "🌙 Sombre" };
  let theme = "auto";
  try {
    const savedTheme = localStorage.getItem(THEME_KEY);
    if (THEME_CYCLE.includes(savedTheme)) theme = savedTheme;
  } catch (e) {}

  function applyTheme() {
    if (theme === "auto") {
      delete document.documentElement.dataset.theme;
    } else {
      document.documentElement.dataset.theme = theme;
    }
    themeToggleEl.textContent = THEME_LABEL[theme];
  }

  themeToggleEl.addEventListener("click", () => {
    theme = THEME_CYCLE[(THEME_CYCLE.indexOf(theme) + 1) % THEME_CYCLE.length];
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    applyTheme();
  });

  applyTheme();

  // --- Applique la langue courante à tout le texte statique de l'interface ---
  function applyLang() {
    document.documentElement.lang = lang;
    headerTaglineEl.textContent = t("tagline");
    statsLineEl.textContent = t("statsLine", COMMANDS.length, GUIDES.length);
    modeTabCommandsLabelEl.textContent = t("modeCommands");
    modeTabFormationLabelEl.textContent = t("modeFormation");
    favToggleEl.title = t("favToggleTitle");
    themeToggleEl.title = t("themeToggleTitle");
    langToggleEl.textContent = t("langToggleLabel");
    searchInput.placeholder = mode === "formation" ? t("searchPlaceholderFormation") : t("searchPlaceholderCommands");
    searchHintEl.textContent = t("searchHint");
  }

  function setLang(newLang) {
    lang = newLang;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyLang();
    renderGroupChips();
    renderChips();
    renderSubchips();
    renderResults();
  }

  langToggleEl.addEventListener("click", () => setLang(lang === "fr" ? "en" : "fr"));

  langGateEl.querySelectorAll(".lang-choice").forEach(btn => {
    btn.addEventListener("click", () => {
      langGateEl.style.display = "none";
      setLang(btn.dataset.lang);
    });
  });

  // Affiche la page de choix de langue seulement si aucune langue n'a
  // jamais été choisie sur cette machine (sinon on l'a déjà en mémoire).
  let langChosen = false;
  try { langChosen = localStorage.getItem(LANG_KEY) === "fr" || localStorage.getItem(LANG_KEY) === "en"; } catch (e) {}
  if (!langChosen) langGateEl.style.display = "flex";

  let mode = "formation"; // "commands" | "formation"
  let activeGroup = "Toutes";
  let activeCategory = "Toutes";
  let activeSubcategory = "Toutes";
  let activeLevel = "Toutes";
  let query = "";
  let showFavoritesOnly = false;

  // Page "cours" plein écran d'une fiche Formation : null = liste normale,
  // sinon la fiche GUIDES actuellement ouverte. Volontairement PAS persisté
  // (on ne rouvre pas un cours en plein milieu au rechargement).
  let openGuide = null;
  let guideStep = "theory"; // "theory" | "exercises"

  // --- Favoris (persistés dans localStorage) ---------------------------
  let favorites = loadFavorites();

  function loadFavorites() {
    try {
      const raw = JSON.parse(localStorage.getItem(FAV_KEY));
      return {
        commands: Array.isArray(raw && raw.commands) ? raw.commands : [],
        formation: Array.isArray(raw && raw.formation) ? raw.formation : []
      };
    } catch (e) {
      return { commands: [], formation: [] };
    }
  }

  function saveFavorites() {
    try { localStorage.setItem(FAV_KEY, JSON.stringify(favorites)); } catch (e) {}
  }

  function favKeyFor(type, item) {
    return type === "formation"
      ? `${item.category}|${item.title}`
      : `${item.category}|${item.subcategory || ""}|${item.title}`;
  }

  function isFavoriteFor(type, item) {
    return favorites[type].includes(favKeyFor(type, item));
  }

  function toggleFavoriteFor(type, key) {
    const list = favorites[type];
    const i = list.indexOf(key);
    if (i === -1) list.push(key); else list.splice(i, 1);
    saveFavorites();
  }

  // Raccourcis liés au mode actif (pratique pour le parcours par onglet)
  function favKey(item) { return favKeyFor(mode, item); }
  function isFavorite(item) { return isFavoriteFor(mode, item); }

  function favCountForCurrentMode() {
    return dataset().filter(item => isFavorite(item)).length;
  }

  // --- Mémorisation du dernier état (localStorage) ----------------------
  function saveState() {
    try {
      localStorage.setItem(STATE_KEY, JSON.stringify({
        mode, activeGroup, activeCategory, activeSubcategory, activeLevel, query, showFavoritesOnly
      }));
    } catch (e) {}
  }

  function restoreState() {
    let saved;
    try { saved = JSON.parse(localStorage.getItem(STATE_KEY)); } catch (e) { saved = null; }
    if (!saved) return;

    if (saved.mode === "commands" || saved.mode === "formation") mode = saved.mode;

    const groups = groupsFor(dataset());
    if (typeof saved.activeGroup === "string" && groups.includes(saved.activeGroup)) {
      activeGroup = saved.activeGroup;
    }

    const cats = categoriesFor(dataset());
    if (typeof saved.activeCategory === "string" && cats.includes(saved.activeCategory)) {
      activeCategory = saved.activeCategory;
    }
    if (typeof saved.activeSubcategory === "string") {
      const subs = ["Toutes", ...subcategoriesFor(activeCategory)];
      if (subs.includes(saved.activeSubcategory)) activeSubcategory = saved.activeSubcategory;
    }
    if (typeof saved.activeLevel === "string") {
      activeLevel = saved.activeLevel; // validé implicitement par le filtre (aucun résultat sinon, sans casser l'UI)
    }
    if (typeof saved.query === "string") query = saved.query;
    if (typeof saved.showFavoritesOnly === "boolean") showFavoritesOnly = saved.showFavoritesOnly;
  }

  function levelClass(level) {
    if (!level) return "";
    if (level.includes("🟢")) return "lvl-green";
    if (level.includes("🟡")) return "lvl-yellow";
    if (level.includes("🔴")) return "lvl-red";
    return "";
  }

  // Enlève l'emoji devant le niveau ("🟢 Débutant" → "Débutant") : on affiche
  // la couleur nous-mêmes via une pastille CSS (levelClass), pour ne pas
  // dépendre du vert/jaune/rouge propre à la police d'emoji du système —
  // qui ne correspond jamais exactement à nos couleurs personnalisées.
  function levelText(level) {
    return (level || "").replace(/^\S+\s*/, "");
  }

  function dataset() {
    return mode === "formation" ? GUIDES : COMMANDS;
  }

  function categoriesFor(list) {
    const scoped = activeGroup === "Toutes" ? list : list.filter(c => groupOf(c.category) === activeGroup);
    return ["Toutes", ...Array.from(new Set(scoped.map(c => c.category)))];
  }

  function subcategoriesFor(cat) {
    if (mode === "formation" || cat === "Toutes") return [];
    return Array.from(new Set(
      COMMANDS.filter(c => c.category === cat && c.subcategory).map(c => c.subcategory)
    ));
  }

  function renderModeTabs() {
    modeTabsEl.querySelectorAll(".mode-tab").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.mode === mode);
    });
    searchInput.placeholder = mode === "formation" ? t("searchPlaceholderFormation") : t("searchPlaceholderCommands");
  }

  function renderFavToggle() {
    favToggleEl.classList.toggle("active", showFavoritesOnly);
    favToggleLabelEl.textContent = t("favLabel", favCountForCurrentMode());
  }

  function renderGroupChips() {
    const groups = groupsFor(dataset());
    if (groups.length <= 2) {
      // un seul groupe présent dans ce mode : pas la peine d'afficher un filtre
      groupChipsEl.style.display = "none";
      groupChipsEl.innerHTML = "";
      return;
    }
    groupChipsEl.style.display = "flex";
    groupChipsEl.innerHTML = groups.map(g => {
      const n = g === "Toutes" ? dataset().length : dataset().filter(c => groupOf(c.category) === g).length;
      const active = g === activeGroup ? "active" : "";
      const label = g === "Toutes" ? t("allChip") : groupLabel(g);
      return `<span class="chip group-chip ${active}" data-group="${escapeAttr(g)}">${escapeHtml(label)}<span class="count-badge">${n}</span></span>`;
    }).join("");
    groupChipsEl.querySelectorAll(".chip").forEach(el => {
      el.addEventListener("click", () => {
        if (el.dataset.group === activeGroup) return;
        activeGroup = el.dataset.group;
        activeCategory = "Toutes";
        activeSubcategory = "Toutes";
        activeLevel = "Toutes";
        saveState();
        renderGroupChips();
        renderChips();
        renderSubchips();
        renderResults();
      });
    });
  }

  function renderChips() {
    // Pas de chip "Toutes" ici : le reset global se fait déjà via le chip
    // "Toutes" du groupe au-dessus (sinon doublon visuel) — reste à effet
    // identique en re-cliquant sur la catégorie déjà active (désélection).
    const categories = categoriesFor(dataset()).filter(cat => cat !== "Toutes");
    chipsEl.innerHTML = categories.map(cat => {
      const n = dataset().filter(c => c.category === cat).length;
      const active = cat === activeCategory ? "active" : "";
      return `<span class="chip ${active}" data-cat="${escapeAttr(cat)}">${escapeHtml(catLabel(cat))}<span class="count-badge">${n}</span></span>`;
    }).join("");
    chipsEl.querySelectorAll(".chip").forEach(el => {
      el.addEventListener("click", () => {
        activeCategory = (el.dataset.cat === activeCategory) ? "Toutes" : el.dataset.cat;
        activeSubcategory = "Toutes";
        activeLevel = "Toutes";
        saveState();
        renderChips();
        renderSubchips();
        renderResults();
      });
    });
  }

  function renderSubchips() {
    if (mode === "formation") {
      renderLevelChips();
      return;
    }
    const subs = subcategoriesFor(activeCategory);
    if (subs.length < 2) {
      subchipsEl.style.display = "none";
      subchipsEl.innerHTML = "";
      return;
    }
    subchipsEl.style.display = "flex";
    subchipsEl.innerHTML = subs.map(sub => {
      const n = COMMANDS.filter(c => c.category === activeCategory && c.subcategory === sub).length;
      const active = sub === activeSubcategory ? "active" : "";
      return `<span class="chip ${active}" data-sub="${escapeAttr(sub)}">${escapeHtml(subcatLabel(sub))}<span class="count-badge">${n}</span></span>`;
    }).join("");
    subchipsEl.querySelectorAll(".chip").forEach(el => {
      el.addEventListener("click", () => {
        // re-cliquer sur la sous-catégorie déjà active désélectionne (retour à "toutes")
        activeSubcategory = (el.dataset.sub === activeSubcategory) ? "Toutes" : el.dataset.sub;
        saveState();
        renderSubchips();
        renderResults();
      });
    });
  }

  function renderLevelChips() {
    const relevant = GUIDES.filter(g =>
      (activeGroup === "Toutes" || groupOf(g.category) === activeGroup) &&
      (activeCategory === "Toutes" || g.category === activeCategory)
    );
    const present = LEVEL_ORDER.filter(lvl => relevant.some(g => g.level === lvl));
    if (present.length < 2) {
      subchipsEl.style.display = "none";
      subchipsEl.innerHTML = "";
      return;
    }
    subchipsEl.style.display = "flex";
    subchipsEl.innerHTML = present.map(lvl => {
      const n = relevant.filter(g => g.level === lvl).length;
      const active = lvl === activeLevel ? "active" : "";
      return `<span class="chip ${active}" data-level="${escapeAttr(lvl)}"><span class="guide-dot ${levelClass(lvl)}"></span>${escapeHtml(translateLevelText(levelText(lvl)))}<span class="count-badge">${n}</span></span>`;
    }).join("");
    subchipsEl.querySelectorAll(".chip").forEach(el => {
      el.addEventListener("click", () => {
        // re-cliquer sur le niveau déjà actif désélectionne (retour à "tous")
        activeLevel = (el.dataset.level === activeLevel) ? "Toutes" : el.dataset.level;
        saveState();
        renderLevelChips();
        renderResults();
      });
    });
  }

  function matchesCommand(item, q) {
    if (!q) return true;
    const loc = localizedCommand(item);
    const haystack = [item.title, loc.title, item.cmd, item.desc, loc.desc, item.category, item.subcategory, ...(item.tags || []), ...(loc.tags || [])]
      .join(" ")
      .toLowerCase();
    return q.toLowerCase().split(/\s+/).every(part => haystack.includes(part));
  }

  function matchesGuide(item, q) {
    if (!q) return true;
    const loc = localizedGuide(item);
    const contentText = (item.content || []).map(s => `${s.heading} ${s.text}`).join(" ");
    const locContentText = (loc.content || []).map(s => `${s.heading} ${s.text}`).join(" ");
    const haystack = [item.title, loc.title, item.summary, loc.summary, item.category, item.level, contentText, locContentText]
      .join(" ")
      .toLowerCase();
    return q.toLowerCase().split(/\s+/).every(part => haystack.includes(part));
  }

  function renderResults() {
    if (openGuide) {
      topRowEl.style.display = "none";
      searchBarEl.style.display = "none";
      renderGuideDetail();
      return;
    }
    topRowEl.style.display = "";
    searchBarEl.style.display = "";

    renderFavToggle();
    const searching = query.trim() !== "";
    chipsWrapEl.style.display = searching ? "none" : "";
    searchHintEl.style.display = searching ? "block" : "none";

    if (searching) {
      renderTransversalResults();
    } else if (mode === "formation") {
      renderGuideResults();
    } else {
      renderCommandResults();
    }
  }

  function openGuideDetail(item) {
    openGuide = item;
    guideStep = "theory";
    renderModeTabs();
    renderResults();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function closeGuideDetail() {
    openGuide = null;
    renderResults();
  }

  function renderGuideDetail() {
    const item = openGuide;
    const loc = localizedGuide(item);
    const fav = isFavoriteFor("formation", item);
    const hasExercises = loc.exercises && loc.exercises.length > 0;
    const onTheory = guideStep === "theory" || !hasExercises;

    let html = `<div class="guide-detail">`;
    html += `<button class="back-btn" data-action="back-to-list">${t("backToList")}</button>`;
    if (lang === "en" && !loc.translated) html += `<div class="translation-notice">${t("formationNotice")}</div>`;
    html += `
      <div class="detail-head">
        <span class="guide-dot ${levelClass(item.level)}" title="${escapeAttr(item.level || "")}"></span>
        <h2 class="detail-title">${escapeHtml(loc.title)}</h2>
        <button class="fav-btn ${fav ? "active" : ""}" data-favtype="formation" data-favkey="${escapeAttr(favKeyFor("formation", item))}" title="${fav ? t("removeFav") : t("addFav")}">${fav ? "★" : "☆"}</button>
      </div>
      <p class="detail-summary">${escapeHtml(loc.summary)}</p>`;

    if (hasExercises) {
      html += `
        <div class="detail-steps">
          <span class="detail-step ${onTheory ? "active" : ""}">${t("stepTheory")}</span>
          <span class="detail-step ${!onTheory ? "active" : ""}">${t("stepExercises")}</span>
        </div>`;
    }

    if (onTheory) {
      html += (loc.content || []).map(s => `
        <div class="guide-section">
          <h4>${escapeHtml(s.heading)}</h4>
          <p>${renderGuideParagraph(s.text)}</p>
        </div>`).join("");
      html += hasExercises
        ? `<button class="next-step-btn" data-action="go-exercises">${t("goExercises")}</button>`
        : `<p class="no-exercises-note">${t("noExercisesNote")}</p>`;
    } else {
      TERMINAL_REGISTRY = {};
      QUIZ_REGISTRY = {};
      FILLIN_REGISTRY = {};
      html += exercisesHtml(loc.exercises, guideDomId(item));
      html += `<button class="next-step-btn secondary" data-action="back-to-theory">${t("backToTheory")}</button>`;
    }

    html += `</div>`;
    resultsEl.innerHTML = html;
    if (!onTheory) initExercises();
  }

  // --- Gabarits de carte réutilisés par le parcours par onglet ET la recherche transversale ---
  function renderRelatedLinks(item) {
    if (!item.related) return "";
    const list = Array.isArray(item.related) ? item.related : [item.related];
    const links = list.map(r => {
      const sep = r.indexOf("::");
      if (sep === -1) return "";
      const cat = r.slice(0, sep), title = r.slice(sep + 2);
      return `<a href="#" class="guide-link" data-cat="${escapeAttr(cat)}" data-title="${escapeAttr(title)}">${escapeHtml(title)}</a>`;
    }).filter(Boolean).join(", ");
    return links ? `<div class="related-line">${t("forUnderstanding")} ${links}</div>` : "";
  }

  function commandCardHtml(item, id) {
    const fav = isFavoriteFor("commands", item);
    const loc = localizedCommand(item);
    return `
      <div class="card" data-command-category="${escapeAttr(item.category)}" data-command-title="${escapeAttr(item.title)}">
        <div class="card-top">
          <div class="card-title-row">
            <button class="fav-btn ${fav ? "active" : ""}" data-favtype="commands" data-favkey="${escapeAttr(favKeyFor("commands", item))}" title="${fav ? t("removeFav") : t("addFav")}">${fav ? "★" : "☆"}</button>
            <div class="card-title">${escapeHtml(loc.title)}</div>
          </div>
          <button class="copy-btn" data-id="${escapeAttr(id)}">${t("copy")}</button>
        </div>
        <pre class="cmd" id="cmd-${escapeAttr(id)}">${escapeHtml(item.cmd)}</pre>
        ${loc.desc ? `<div class="desc">${escapeHtml(loc.desc)}</div>` : ""}
        ${loc.tags && loc.tags.length ? `<div class="tags">${loc.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>` : ""}
        ${renderRelatedLinks(item)}
      </div>`;
  }

  // --- Exercices pratiques : terminal simulé, QCM, réponse à saisir --------
  // Registres reconstruits à chaque rendu : id de l'encadré → état.
  let TERMINAL_REGISTRY = {};
  let QUIZ_REGISTRY = {};
  let FILLIN_REGISTRY = {};

  function terminalHtml(ex, termId) {
    if (ex.type !== "terminal" || !ex.terminal) return "";
    TERMINAL_REGISTRY[termId] = { steps: ex.terminal.steps || [], stepIndex: 0, hint: ex.hint || "" };
    return `
      <div class="fterm" id="${escapeAttr(termId)}">
        <div class="fterm-output"></div>
        <div class="fterm-inputline">
          <span class="fterm-prompt">${escapeHtml(ex.terminal.prompt || "user@mint:~$")}</span>
          <input type="text" class="fterm-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${escapeAttr(t("terminalPlaceholder"))}">
        </div>
      </div>`;
  }

  function quizHtml(ex, quizId) {
    if (ex.type !== "quiz" || !ex.options) return "";
    QUIZ_REGISTRY[quizId] = { correctIndex: ex.correctIndex, correction: ex.correction, answered: false };
    const opts = ex.options.map((opt, idx) =>
      `<button class="quiz-option" data-idx="${idx}">${escapeHtml(opt)}</button>`
    ).join("");
    return `
      <div class="quiz" id="${escapeAttr(quizId)}">
        <div class="quiz-options">${opts}</div>
        <div class="quiz-feedback"></div>
      </div>`;
  }

  function fillinHtml(ex, fillId) {
    if (ex.type !== "fillin") return "";
    FILLIN_REGISTRY[fillId] = {
      accept: Array.isArray(ex.accept) ? ex.accept : [ex.accept],
      correction: ex.correction,
      answered: false
    };
    return `
      <div class="fillin" id="${escapeAttr(fillId)}">
        <div class="fillin-row">
          <input type="text" class="fillin-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${escapeAttr(t("fillinPlaceholder"))}">
          <button class="fillin-check">${t("fillinCheck")}</button>
        </div>
        <div class="fillin-feedback"></div>
      </div>`;
  }

  function exercisesHtml(exercises, ownerId) {
    if (!exercises || !exercises.length) return "";
    const items = exercises.map((ex, idx) => {
      let interactive = "";
      if (ex.type === "terminal") interactive = terminalHtml(ex, `fterm-${ownerId}-${idx}`);
      else if (ex.type === "quiz") interactive = quizHtml(ex, `quiz-${ownerId}-${idx}`);
      else if (ex.type === "fillin") interactive = fillinHtml(ex, `fillin-${ownerId}-${idx}`);

      // Le terminal garde une correction repliable à part (utile même une
      // fois l'exercice réussi) ; QCM et réponse-à-saisir affichent leur
      // correction automatiquement dès qu'on répond, pas besoin de la
      // redemander séparément.
      const reveal = ex.type === "quiz" || ex.type === "fillin" ? "" : `
        <details class="exercise-reveal">
          <summary>${t("seeCorrection")}</summary>
          <div class="exercise-correction-body">${escapeHtml(ex.correction)}</div>
        </details>`;

      return `
        <div class="exercise">
          <p class="exercise-instruction">📝 ${escapeHtml(ex.instruction)}</p>
          ${interactive}
          ${reveal}
        </div>`;
    }).join("");
    return `
      <div class="exercises-block">
        ${items}
      </div>`;
  }

  // Attache les écouteurs sur chaque encadré interactif fraîchement rendu.
  function initExercises() {
    initTerminals();
    initQuizzes();
    initFillins();
  }

  function initQuizzes() {
    Object.keys(QUIZ_REGISTRY).forEach(quizId => {
      const root = document.getElementById(quizId);
      if (!root) return;
      const state = QUIZ_REGISTRY[quizId];
      const feedbackEl = root.querySelector(".quiz-feedback");
      root.querySelectorAll(".quiz-option").forEach(btn => {
        if (btn.dataset.wired) return;
        btn.dataset.wired = "1";
        btn.addEventListener("click", () => {
          if (state.answered) return;
          state.answered = true;
          const idx = parseInt(btn.dataset.idx, 10);
          root.querySelectorAll(".quiz-option").forEach((b, i) => {
            if (i === state.correctIndex) b.classList.add("correct");
            else if (i === idx) b.classList.add("incorrect");
          });
          const ok = idx === state.correctIndex;
          feedbackEl.innerHTML = `<span class="${ok ? "feedback-ok" : "feedback-ko"}">${ok ? t("quizCorrect") : t("quizIncorrect")}</span> ${escapeHtml(state.correction)}`;
          feedbackEl.classList.add("visible");
        });
      });
    });
  }

  function initFillins() {
    Object.keys(FILLIN_REGISTRY).forEach(fillId => {
      const root = document.getElementById(fillId);
      if (!root) return;
      const inputEl = root.querySelector(".fillin-input");
      const checkBtn = root.querySelector(".fillin-check");
      const feedbackEl = root.querySelector(".fillin-feedback");
      if (!inputEl || !checkBtn || checkBtn.dataset.wired) return;
      checkBtn.dataset.wired = "1";
      const state = FILLIN_REGISTRY[fillId];

      const check = () => {
        if (state.answered) return;
        const normalize = s => s.toLowerCase().replace(/\s+/g, " ").trim();
        const val = normalize(inputEl.value);
        const ok = val !== "" && state.accept.some(a => normalize(a) === val);
        state.answered = true;
        inputEl.disabled = true;
        checkBtn.disabled = true;
        root.classList.add(ok ? "fillin-correct" : "fillin-incorrect");
        feedbackEl.innerHTML = `<span class="${ok ? "feedback-ok" : "feedback-ko"}">${ok ? t("quizCorrect") : t("quizIncorrect")}</span> ${escapeHtml(state.correction)}`;
        feedbackEl.classList.add("visible");
      };

      checkBtn.addEventListener("click", check);
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); check(); }
      });
    });
  }

  function initTerminals() {
    Object.keys(TERMINAL_REGISTRY).forEach(termId => {
      const root = document.getElementById(termId);
      if (!root) return;
      const inputEl = root.querySelector(".fterm-input");
      const outputEl = root.querySelector(".fterm-output");
      if (!inputEl || !outputEl || inputEl.dataset.wired) return;
      inputEl.dataset.wired = "1";
      const state = TERMINAL_REGISTRY[termId];

      const appendLine = (text, cls) => {
        const line = document.createElement("div");
        line.className = "fterm-line" + (cls ? " " + cls : "");
        line.textContent = text;
        outputEl.appendChild(line);
        outputEl.scrollTop = outputEl.scrollHeight;
      };

      inputEl.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        const raw = inputEl.value.trim();
        if (!raw) return;
        appendLine("$ " + raw, "fterm-cmd");
        inputEl.value = "";
        if (state.stepIndex >= state.steps.length) return;

        const normalize = s => s.replace(/\s+/g, " ").trim();
        const cmd = normalize(raw);
        const step = state.steps[state.stepIndex];
        const expected = Array.isArray(step.expect) ? step.expect : [step.expect];
        const ok = expected.some(e => normalize(e) === cmd);

        if (ok) {
          if (step.output) appendLine(step.output, "fterm-out");
          state.stepIndex++;
          if (state.stepIndex >= state.steps.length) {
            appendLine(t("exerciseSuccess"), "fterm-success");
            root.classList.add("fterm-done");
          }
        } else {
          appendLine(
            state.hint ? t("exerciseHintPrefix", state.hint) : t("exerciseWrongCommand"),
            "fterm-error"
          );
        }
      });
    });
  }

  // Ligne cliquable dans la liste — ouvre la page dédiée de la fiche
  // (théorie puis, le cas échéant, exercices), plutôt qu'un accordéon.
  function guideCardHtml(item) {
    const fav = isFavoriteFor("formation", item);
    const hasExercises = item.exercises && item.exercises.length > 0;
    const loc = localizedGuide(item);
    return `
      <div class="guide-card guide-card-row" data-cat="${escapeAttr(item.category)}" data-title="${escapeAttr(item.title)}">
        <div class="guide-row-top">
          <span class="guide-dot ${levelClass(item.level)}" title="${escapeAttr(item.level || "")}"></span>
          <span class="guide-title">${escapeHtml(loc.title)}</span>
          ${hasExercises ? `<span class="exercise-flag" title="${escapeAttr(t("hasExercisesTitle"))}">🧪</span>` : ""}
          <button class="fav-btn ${fav ? "active" : ""}" data-favtype="formation" data-favkey="${escapeAttr(favKeyFor("formation", item))}" title="${fav ? t("removeFav") : t("addFav")}">${fav ? "★" : "☆"}</button>
        </div>
        <p class="guide-row-summary">${escapeHtml(loc.summary)}</p>
      </div>`;
  }

  function renderCommandResults() {
    const filtered = COMMANDS.filter(item =>
      (activeGroup === "Toutes" || groupOf(item.category) === activeGroup) &&
      (activeCategory === "Toutes" || item.category === activeCategory) &&
      (activeSubcategory === "Toutes" || item.subcategory === activeSubcategory) &&
      (!showFavoritesOnly || isFavoriteFor("commands", item)) &&
      matchesCommand(item, query)
    );

    if (filtered.length === 0) {
      resultsEl.innerHTML = showFavoritesOnly
        ? `<div class="empty">${t("emptyCommandsFav")}</div>`
        : `<div class="empty">${t("emptyCommands")}</div>`;
      return;
    }

    // group by category, then by subcategory (if present), in the order they first appear
    const grouped = {};
    filtered.forEach(item => {
      const catBucket = (grouped[item.category] = grouped[item.category] || { __order: [], subs: {} });
      const subKey = item.subcategory || "__none";
      if (!catBucket.subs[subKey]) {
        catBucket.subs[subKey] = [];
        catBucket.__order.push(subKey);
      }
      catBucket.subs[subKey].push(item);
    });

    let html = "";
    Object.keys(grouped).forEach(cat => {
      html += `<div class="group-title">${escapeHtml(catLabel(cat))}</div>`;
      const catBucket = grouped[cat];
      catBucket.__order.forEach(subKey => {
        if (subKey !== "__none") {
          html += `<div class="subgroup-title">${escapeHtml(subcatLabel(subKey))}</div>`;
        }
        catBucket.subs[subKey].forEach((item, idx) => {
          html += commandCardHtml(item, `${cat}-${subKey}-${idx}`);
        });
      });
    });
    resultsEl.innerHTML = html;
  }

  function renderGuideResults() {
    const filtered = GUIDES.filter(item =>
      (activeGroup === "Toutes" || groupOf(item.category) === activeGroup) &&
      (activeCategory === "Toutes" || item.category === activeCategory) &&
      (activeLevel === "Toutes" || item.level === activeLevel) &&
      (!showFavoritesOnly || isFavoriteFor("formation", item)) &&
      matchesGuide(item, query)
    );

    if (filtered.length === 0) {
      resultsEl.innerHTML = showFavoritesOnly
        ? `<div class="empty">${t("emptyFormationFav")}</div>`
        : `<div class="empty">${t("emptyFormation")}</div>`;
      return;
    }

    // groupé par niveau (vert → jaune → rouge), puis par thème à l'intérieur
    const levelsPresent = LEVEL_ORDER.filter(lvl => filtered.some(g => g.level === lvl));
    const grouped = {};
    levelsPresent.forEach(lvl => {
      grouped[lvl] = {};
      filtered.filter(g => g.level === lvl).forEach(item => {
        (grouped[lvl][item.category] = grouped[lvl][item.category] || []).push(item);
      });
    });

    let html = "";
    levelsPresent.forEach(lvl => {
      html += `<div class="level-title ${levelClass(lvl)}">${escapeHtml(translateLevelText(levelText(lvl)))}</div>`;
      Object.keys(grouped[lvl]).forEach(cat => {
        html += `<div class="subgroup-title">${escapeHtml(catLabel(cat))}</div>`;
        grouped[lvl][cat].forEach(item => {
          html += guideCardHtml(item);
        });
      });
    });
    resultsEl.innerHTML = html;
  }

  function renderTransversalResults() {
    const cmdMatches = COMMANDS.filter(item => (!showFavoritesOnly || isFavoriteFor("commands", item)) && matchesCommand(item, query));
    const guideMatches = GUIDES.filter(item => (!showFavoritesOnly || isFavoriteFor("formation", item)) && matchesGuide(item, query));

    if (cmdMatches.length === 0 && guideMatches.length === 0) {
      resultsEl.innerHTML = `<div class="empty">${t("emptyBoth")}</div>`;
      return;
    }

    let html = "";
    if (cmdMatches.length > 0) {
      html += `<div class="group-title">🧰 ${t("modeCommands")} (${cmdMatches.length})</div>`;
      cmdMatches.forEach((item, idx) => {
        html += commandCardHtml(item, `search-cmd-${idx}`);
      });
    }
    if (guideMatches.length > 0) {
      html += `<div class="group-title">📘 ${t("modeFormation")} (${guideMatches.length})</div>`;
      guideMatches.forEach(item => {
        html += guideCardHtml(item);
      });
    }
    resultsEl.innerHTML = html;
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    }
    return fallbackCopy(text);
  }

  function fallbackCopy(text) {
    return new Promise((resolve) => {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      resolve();
    });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, s => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[s]));
  }
  function escapeAttr(str) { return escapeHtml(str); }

  // --- Liens internes entre fiches Formation : [[Catégorie::Titre]] ------
  // Commande entre backticks dans le texte d'une fiche : toujours stylée
  // comme dans Commandes ; cliquable et menant directement à la carte
  // uniquement quand cette commande exacte y existe (COMMAND_BY_CMD).
  function renderInlineCode(segment) {
    const re = /`([^`]+)`/g;
    let out = "";
    let last = 0;
    let m;
    while ((m = re.exec(segment)) !== null) {
      out += escapeHtml(segment.slice(last, m.index));
      const code = m[1];
      const cmd = COMMAND_BY_CMD.get(code);
      out += cmd
        ? `<a href="#" class="inline-cmd" data-command-category="${escapeAttr(cmd.category)}" data-command-title="${escapeAttr(cmd.title)}">${escapeHtml(code)}</a>`
        : `<code class="inline-cmd">${escapeHtml(code)}</code>`;
      last = re.lastIndex;
    }
    out += escapeHtml(segment.slice(last));
    return out;
  }

  function renderGuideParagraph(text) {
    const re = /\[\[([^:\]]+)::([^\]]+)\]\]/g;
    let out = "";
    let last = 0;
    let m;
    while ((m = re.exec(text)) !== null) {
      out += renderInlineCode(text.slice(last, m.index));
      const cat = m[1], title = m[2];
      // data-cat/data-title restent le titre FRANÇAIS canonique (identité de
      // la fiche, sert à la navigation) ; seul le texte affiché du lien est
      // traduit s'il existe une version anglaise de la fiche ciblée.
      const targetTr = guideTranslation(cat, title);
      const label = targetTr && targetTr.title ? targetTr.title : title;
      out += `<a href="#" class="guide-link" data-cat="${escapeAttr(cat)}" data-title="${escapeAttr(title)}">${escapeHtml(label)}</a>`;
      last = re.lastIndex;
    }
    out += renderInlineCode(text.slice(last));
    return out;
  }

  function hashStr(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }
  function guideDomId(item) {
    return "guide-" + hashStr(`${item.category}|${item.title}`);
  }

  function navigateToGuide(cat, title) {
    const target = GUIDES.find(g => g.category === cat && g.title === title);
    if (!target) return;
    mode = "formation";
    openGuideDetail(target);
  }

  // Délégation unique : marche pour toutes les cartes, quel que soit
  // l'endroit où elles sont rendues (parcours par onglet ou recherche
  // transversale), sans avoir à ré-attacher des écouteurs à chaque rendu.
  resultsEl.addEventListener("click", (e) => {
    const link = e.target.closest(".guide-link");
    if (link) {
      e.preventDefault();
      navigateToGuide(link.dataset.cat, link.dataset.title);
      return;
    }

    const cmdLink = e.target.closest("a.inline-cmd");
    if (cmdLink) {
      e.preventDefault();
      navigateToCommand(cmdLink.dataset.commandCategory, cmdLink.dataset.commandTitle);
      return;
    }

    const favBtn = e.target.closest(".fav-btn");
    if (favBtn) {
      e.preventDefault();
      e.stopPropagation(); // évite de (dé)plier une fiche Formation au clic sur son étoile
      toggleFavoriteFor(favBtn.dataset.favtype, favBtn.dataset.favkey);
      renderResults();
      return;
    }

    const copyBtn = e.target.closest(".copy-btn");
    if (copyBtn) {
      const id = copyBtn.dataset.id;
      const text = document.getElementById(`cmd-${id}`).textContent;
      copyToClipboard(text).then(() => {
        const original = copyBtn.textContent;
        copyBtn.textContent = t("copied");
        copyBtn.classList.add("copied");
        setTimeout(() => {
          copyBtn.textContent = original;
          copyBtn.classList.remove("copied");
        }, 1200);
      });
      return;
    }

    const actionBtn = e.target.closest("[data-action]");
    if (actionBtn) {
      const action = actionBtn.dataset.action;
      if (action === "back-to-list") closeGuideDetail();
      else if (action === "go-exercises") { guideStep = "exercises"; renderResults(); window.scrollTo({ top: 0, behavior: "smooth" }); }
      else if (action === "back-to-theory") { guideStep = "theory"; renderResults(); window.scrollTo({ top: 0, behavior: "smooth" }); }
      return;
    }

    const guideRow = e.target.closest(".guide-card-row");
    if (guideRow) {
      const target = GUIDES.find(g => g.category === guideRow.dataset.cat && g.title === guideRow.dataset.title);
      if (target) openGuideDetail(target);
    }
  });

  searchInput.addEventListener("input", (e) => {
    query = e.target.value;
    saveState();
    renderResults();
  });

  document.addEventListener("keydown", (e) => {
    if (openGuide) {
      if (e.key === "Escape") closeGuideDetail();
      return;
    }
    if (e.key === "/" && document.activeElement !== searchInput) {
      e.preventDefault();
      searchInput.focus();
    }
    if (e.key === "Escape") {
      searchInput.value = "";
      query = "";
      saveState();
      searchInput.blur();
      renderResults();
    }
  });

  favToggleEl.addEventListener("click", () => {
    showFavoritesOnly = !showFavoritesOnly;
    saveState();
    renderResults();
  });

  modeTabsEl.querySelectorAll(".mode-tab").forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.dataset.mode === mode) return;
      mode = btn.dataset.mode;
      activeCategory = "Toutes";
      activeSubcategory = "Toutes";
      activeLevel = "Toutes";
      query = "";
      searchInput.value = "";
      saveState();
      renderModeTabs();
      renderGroupChips();
      renderChips();
      renderSubchips();
      renderResults();
    });
  });

  // --- Restauration du dernier état avant le tout premier rendu ---
  restoreState();
  searchInput.value = query;
  applyLang();
  renderModeTabs();
  renderGroupChips();
  renderChips();
  renderSubchips();
  renderResults();
</script>
